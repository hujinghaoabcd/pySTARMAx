site_name: pySTARMAx
site_description: Modern space-time autoregressive moving-average modelling in Python
repo_url: https://github.com/hujinghaoabcd/pySTARMAx
repo_name: hujinghaoabcd/pySTARMAx
theme:
  name: material
nav:
  - Home: index.md
  - Model convention: model.md
  - Stationarity and invertibility: admissibility.md
  - Ordinary STARIMA: starima.md
  - Conditional Kalman STARIMA: integrated_maximum_likelihood.md
  - Seasonal STARIMA: seasonal.md
  - Seasonal Kalman STARIMA: seasonal_maximum_likelihood.md
  - Seasonal likelihood inference: seasonal_likelihood_inference.md
  - State-space filtering: state_space.md
  - Fixed-interval smoothing: smoothing.md
  - Original innovation smoothing: innovation_smoothing.md
  - Maximum likelihood: maximum_likelihood.md
  - Likelihood inference: likelihood_inference.md
  - Innovation covariance inference: covariance_inference.md
  - Kalman forecast intervals: kalman_forecast_intervals.md
  - Forecasting: forecasting.md
  - Bootstrap intervals: bootstrap.md
  - Rolling evaluation: evaluation.md
  - Diagnostics: diagnostics.md
  - Roadmap: roadmap.md
  - References: references.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
