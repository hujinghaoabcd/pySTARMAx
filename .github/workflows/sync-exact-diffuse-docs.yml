name: Synchronize exact diffuse docs

on:
  push:
    branches:
      - agent/exact-diffuse-kalman

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exact-diffuse-kalman
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Synchronize README and guides
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme_path = Path("README.md")
          readme = readme_path.read_text()
          old = '''> **Status — 0.0.18:** stationary, ordinary-integrated, and
          > multiplicative seasonal Gaussian Kalman STARMA/STARIMA estimation;
          > expanded AR stationarity and positive-sign MA invertibility diagnostics;
          > observed-information Hessian inference for stationary and seasonal factor
          > models; natural innovation covariance delta-method inference; missing-data
          > filtering; RTS state and original innovation smoothing; fixed-parameter
          > Gaussian forecast intervals with filtered-state and future-innovation
          > uncertainty; pathwise original-scale ordinary/seasonal reconstruction;
          > conditional/bootstrap intervals; and rolling evaluation. Exact diffuse
          > integrated likelihood, parameter-aware Kalman intervals, sparse computation,
          > exogenous regressors, and time-varying extensions remain planned.
          '''
          new = '''> **Status — 0.0.19:** stationary, conditional ordinary-integrated, and
          > multiplicative seasonal Gaussian Kalman STARMA/STARIMA estimation;
          > expanded AR stationarity and positive-sign MA invertibility diagnostics;
          > observed-information Hessian and natural covariance inference; missing-data
          > filtering; RTS state and original innovation smoothing; fixed-parameter
          > Gaussian forecast intervals with pathwise ordinary/seasonal reconstruction;
          > and a separate exact diffuse filter with ordinary integrated level-state
          > construction and fixed-parameter likelihood. Optimizer-facing exact diffuse
          > MLE, exact diffuse smoothing, seasonal diffuse augmentation, sparse
          > computation, exogenous regressors, and time-varying extensions remain planned.
          '''
          if old not in readme:
              raise SystemExit("README status block not found")
          readme = readme.replace(old, new, 1)

          marker = '''See [`docs/integrated_maximum_likelihood.md`](docs/integrated_maximum_likelihood.md).
          
          ## Observed-information inference
          '''
          addition = '''See [`docs/integrated_maximum_likelihood.md`](docs/integrated_maximum_likelihood.md).
          
          ## Exact diffuse filtering and level-state likelihood
          
          Version 0.0.19 adds a separate exact diffuse route without changing the
          conditional estimator or the existing approximate `initialization="diffuse"`:
          
          ```python
          from pystarmax import build_exact_integrated_state_space
          
          exact_specification = build_exact_integrated_state_space(
              transformed_state_space,
              integration_order=1,
          )
          exact_result = exact_specification.filter(level_series)
          
          print(exact_result.log_likelihood)
          print(exact_result.filtered_diffuse_rank)
          print(exact_result.diffuse_end_time)
          ```
          
          The exact filter stores finite covariance `P_*` and diffuse covariance
          `P_inf` separately, uses sequential `K0`/`K1` updates, supports missing and
          partially observed rows, and switches to ordinary Gaussian updates after the
          diffuse rank reaches zero. The ordinary integrated constructor augments a
          stationary transformed state with explicit level/difference states and assigns
          diffuse covariance only to the integration directions.
          
          This stage exposes filtering and fixed-parameter level likelihoods. It does
          not yet replace `KalmanSTARIMA.fit()` with an optimizer-facing exact diffuse
          estimator. See [`docs/exact_diffuse.md`](docs/exact_diffuse.md).
          
          ## Observed-information inference
          '''
          if marker not in readme:
              raise SystemExit("README exact diffuse insertion marker not found")
          readme = readme.replace(marker, addition, 1)

          old = '''Initialization options are stationary, user-supplied known moments, and an
          explicit approximate diffuse initialization. The diffuse option is a
          large-variance approximation, not an exact diffuse likelihood.
          '''
          new = '''Initialization options in `kalman_filter()` are stationary, user-supplied
          known moments, and an explicit approximate diffuse initialization. That diffuse
          option remains a large-variance approximation. Exact diffuse filtering is
          available separately through `exact_diffuse_filter()` and
          `build_exact_integrated_state_space()` so the two likelihood conventions are
          never silently conflated.
          '''
          if old not in readme:
              raise SystemExit("README initialization paragraph not found")
          readme = readme.replace(old, new, 1)

          old = '''- `KalmanSTARIMA` uses a conditional differenced likelihood rather than exact
            diffuse integration on the level process;
          - seasonal likelihood-Hessian inference uses finite differences and can be costly or step sensitive;
          - original-scale ordinary and seasonal Kalman STARIMA forecast intervals are not yet exposed;
          - exact diffuse filtering and smoothing are unavailable;
          '''
          new = '''- `KalmanSTARIMA.fit()` still uses a conditional differenced likelihood;
          - exact diffuse filtering and fixed-parameter ordinary level likelihood are
            available separately, but optimizer-facing exact diffuse MLE is not;
          - exact diffuse smoothing and seasonal diffuse augmentation are unavailable;
          - seasonal likelihood-Hessian inference uses finite differences and can be
            costly or step sensitive;
          - Kalman forecast intervals condition on fitted parameters;
          '''
          if old not in readme:
              raise SystemExit("README limitations block not found")
          readme = readme.replace(old, new, 1)
          readme_path.write_text(readme)

          index_path = Path("docs/index.md")
          index = index_path.read_text()
          old = '''combined differencing, original-scale forecast reconstruction, fixed-parameter
          Gaussian Kalman forecast intervals, conditional and bootstrap intervals, and
          rolling-origin calibration diagnostics.
          '''
          new = '''combined differencing, original-scale forecast reconstruction, fixed-parameter
          Gaussian Kalman forecast intervals, a separate exact diffuse filter and ordinary
          integrated level-state likelihood, conditional and bootstrap intervals, and
          rolling-origin calibration diagnostics.
          '''
          if old not in index:
              raise SystemExit("docs index intro not found")
          index = index.replace(old, new, 1)
          marker = '''[Conditional integrated Kalman STARIMA](integrated_maximum_likelihood.md)
          documents ordinary differencing before the stationary likelihood, conditioning
          on the first `d` level rows, missing-value propagation, and the separation
          between transformed and recursively restored original scales.
          '''
          addition = marker + '''
          [Exact diffuse filtering](exact_diffuse.md) documents the separate
          `P_* + kappa P_inf` covariance decomposition, sequential diffuse updates,
          missing-observation rank behavior, deterministic measurements, and fixed-
          parameter ordinary integrated level-state construction. It does not silently
          reinterpret the conditional `KalmanSTARIMA.fit()` likelihood.
          '''
          if marker not in index:
              raise SystemExit("docs index integrated paragraph not found")
          index = index.replace(marker, addition, 1)
          index_path.write_text(index)

          state_path = Path("docs/state_space.md")
          state = state_path.read_text()
          old = '''Version 0.0.8 introduced fixed-parameter filtering with incomplete observation
          matrices. Version 0.0.9 added direct Gaussian Kalman maximum likelihood. Version
          0.0.13 adds a separate fixed-interval smoothing layer documented in
          [Fixed-interval state smoothing](smoothing.md).
          '''
          new = '''Version 0.0.8 introduced fixed-parameter filtering with incomplete observation
          matrices. Version 0.0.9 added direct Gaussian Kalman maximum likelihood. Version
          0.0.13 added fixed-interval smoothing. Version 0.0.19 adds a separate exact
          diffuse kernel and ordinary integrated level-state constructor documented in
          [Exact diffuse filtering](exact_diffuse.md).
          '''
          if old not in state:
              raise SystemExit("state-space version paragraph not found")
          state = state.replace(old, new, 1)
          old = '''This uses zero initial mean and a large diagonal covariance. It is an explicit
          large-variance approximation, not an exact diffuse likelihood. The chosen scale
          can affect early likelihood contributions and should be reported.
          '''
          new = '''This uses zero initial mean and a large diagonal covariance. It is an explicit
          large-variance approximation, not an exact diffuse likelihood. The chosen scale
          can affect early likelihood contributions and should be reported.
          
          For exact initialization, use `exact_diffuse_filter()` with separate finite and
          diffuse covariance components, or `build_exact_integrated_state_space()` for an
          ordinary integrated level process. The exact route reports diffuse-rank paths and
          contains no arbitrary `diffuse_scale`.
          '''
          if old not in state:
              raise SystemExit("state-space approximate diffuse paragraph not found")
          state = state.replace(old, new, 1)
          start = state.index("## Current scope")
          replacement = '''## Current scope
          
          Included through 0.0.19:
          
          - auditable stationary and arbitrary-lag STARMA state-space construction;
          - stationary, known, and approximate diffuse initialization;
          - separate exact diffuse filtering with finite/diffuse covariance components;
          - fixed-parameter Gaussian filtering and likelihood with partial-location and
            fully missing rows;
          - stationary, ordinary-integrated, and multiplicative seasonal Kalman wrappers;
          - RTS fixed-interval state smoothing and original innovation smoothing;
          - exact diffuse ordinary integrated level-state construction for fixed
            transformed parameters;
          - Gaussian forecast paths and pathwise original-scale intervals;
          - rank, pseudoinverse, support, and diffuse-phase diagnostics.
          
          Not included:
          
          - optimizer-facing exact diffuse STARIMA maximum likelihood;
          - exact diffuse smoothing;
          - seasonal diffuse state augmentation;
          - parameter-uncertainty propagation into filtering, smoothing, or Kalman paths;
          - cross-time original innovation covariance and simulation smoothing;
          - sparse state matrices for large location systems.
          '''
          state = state[:start] + replacement
          state_path.write_text(state)

          integrated_path = Path("docs/integrated_maximum_likelihood.md")
          integrated = integrated_path.read_text()
          marker = '''This distinction is exposed in the result summary rather than hidden behind the
          word “integrated.”
          '''
          addition = marker + '''
          Version 0.0.19 adds a separate fixed-parameter exact diffuse level-state route.
          Given a stationary transformed `StateSpaceModel`,
          `build_exact_integrated_state_space()` augments explicit level and lower-
          difference states and evaluates the original-level exact diffuse likelihood.
          It does not yet optimize STARMA parameters and therefore does not replace this
          conditional estimator. See [Exact diffuse filtering](exact_diffuse.md).
          '''
          if marker not in integrated:
              raise SystemExit("conditional/exact distinction marker not found")
          integrated = integrated.replace(marker, addition, 1)
          integrated_path.write_text(integrated)
          PY
      - name: Update roadmap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("docs/roadmap.md")
          text = path.read_text()
          marker = "## Next priorities\n"
          section = '''## Implemented in 0.0.19: exact diffuse filtering and ordinary level states
          
          - separate exact diffuse filtering without changing approximate
            `initialization="diffuse"` semantics;
          - initial covariance decomposition `P_* + kappa P_inf`;
          - sequential scalar diffuse and ordinary Gaussian updates;
          - immutable finite/diffuse covariance, innovation, mask, likelihood, and rank
            diagnostics;
          - missing and partial-location observations without artificial rank reduction;
          - deterministic zero-variance agreement and contradiction handling;
          - ordinary integrated augmentation `[y, Delta y, ..., Delta^(d-1)y, beta]`;
          - stationary finite initialization for the transformed STARMA state and diffuse
            initialization only for integration directions;
          - first- and second-order analytic integrated likelihood references;
          - large-variance-limit, `d=0`, matrix-orientation, missing-data, and
            cross-platform validation;
          - mathematical guide, runnable example, navigation, README, status, and Step 19
            handoff.
          
          ## Next priorities
          '''
          if marker not in text:
              raise SystemExit("roadmap next priorities marker not found")
          text = text.replace(marker, section, 1)
          old = '''1. Exact diffuse integrated level-state likelihood and smoothing as a separate
             API from the conditional transformed likelihoods.
          2. Parameter-aware Kalman forecast paths using observed-information or bootstrap
             parameter draws.
          3. Sparse spatial weights and sparse arbitrary-lag state matrices for large
             seasonal periods and networks.
          4. Cross-time innovation-disturbance covariance and conditional simulation
             smoothing.
          5. Smooth stationarity/invertibility parameterization for optimization and
             inference.
          6. Automatic ordinary and seasonal order selection using diagnostics and
             information criteria.
          7. Exogenous regressors and intervention variables.
          8. GeoPandas, libpysal, NetworkX, and OSMnx adapters.
          9. Cross-language estimator fixtures and the first PyPI pre-release.
          10. Optional parallel bootstrap, forecast-path, and rolling-origin execution.
          11. Profile likelihood, sandwich, conformal, generalized, location-varying, and
              time-varying extensions.
          '''
          new = '''1. Optimizer-facing exact diffuse ordinary STARIMA maximum likelihood.
          2. Exact diffuse fixed-interval smoothing and disturbance smoothing.
          3. Seasonal ordinary-seasonal diffuse state augmentation.
          4. Parameter-aware Kalman forecast paths using observed-information or bootstrap
             parameter draws.
          5. Sparse spatial weights and sparse arbitrary-lag state matrices for large
             seasonal periods and networks.
          6. Cross-time innovation-disturbance covariance and conditional simulation
             smoothing.
          7. Smooth stationarity/invertibility parameterization for optimization and
             inference.
          8. Automatic ordinary and seasonal order selection using diagnostics and
             information criteria.
          9. Exogenous regressors and intervention variables.
          10. GeoPandas, libpysal, NetworkX, and OSMnx adapters.
          11. Cross-language estimator fixtures, PyPI pre-release, parallel execution,
              profile likelihood, sandwich, conformal, and time-varying extensions.
          '''
          if old not in text:
              raise SystemExit("roadmap priority list not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit synchronized docs and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/sync-exact-diffuse-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/index.md docs/state_space.md \
            docs/integrated_maximum_likelihood.md docs/roadmap.md
          git commit -m "Synchronize exact diffuse documentation"
          git push
