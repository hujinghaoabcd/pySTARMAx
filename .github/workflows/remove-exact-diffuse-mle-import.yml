name: Remove exact diffuse MLE import

on:
  push:
    branches:
      - agent/exact-diffuse-mle

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exact-diffuse-mle
      - name: Remove unused import
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/pystarmax/exact_diffuse_mle.py")
          text = path.read_text()
          line = "from pystarmax._maximum_likelihood_result import KalmanSTARMAResult\n"
          if line not in text:
              raise SystemExit("unused import not found")
          path.write_text(text.replace(line, "", 1))
          PY
      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/remove-exact-diffuse-mle-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pystarmax/exact_diffuse_mle.py
          git commit -m "Remove unused exact diffuse MLE import"
          git push
