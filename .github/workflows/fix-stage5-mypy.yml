name: Fix stage 5 mypy issues

on:
  push:
    branches: [agent/original-scale-forecast-intervals]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/original-scale-forecast-intervals
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply audited typing fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          forecasting = Path('src/pystarmax/forecasting.py')
          text = forecasting.read_text(encoding='utf-8')
          old = '        return self.mean.shape\n'
          new = '        return int(self.mean.shape[0]), int(self.mean.shape[1])\n'
          if text.count(old) != 1:
              raise SystemExit(f'forecasting target count: {text.count(old)}')
          forecasting.write_text(text.replace(old, new), encoding='utf-8')

          seasonal = Path('src/pystarmax/models/seasonal_starima.py')
          text = seasonal.read_text(encoding='utf-8')
          old = '        self.core_model_ = core\n        self._internal_residuals = core._internal_residuals.copy()\n'
          new = (
              '        self.core_model_ = core\n'
              '        if core._internal_residuals is None:\n'
              '            raise RuntimeError("STARMA fit did not retain internal residuals")\n'
              '        self._internal_residuals = core._internal_residuals.copy()\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'seasonal target count: {text.count(old)}')
          seasonal.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python -m pip install -e '.[dev]'
          python -m black src/pystarmax/forecasting.py src/pystarmax/models/seasonal_starima.py
          python -m isort src/pystarmax/forecasting.py src/pystarmax/models/seasonal_starima.py
          python -m mypy
          rm .github/workflows/fix-stage5-mypy.yml
          git diff --check
      - name: Commit typing fixes and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix forecast interval typing"
          git push origin HEAD:agent/original-scale-forecast-intervals
