name: Fix exact integrated state space

on:
  push:
    branches:
      - agent/exact-diffuse-kalman

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exact-diffuse-kalman
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install black==26.5.1 isort==8.0.1
      - name: Fix innovation dimension
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/pystarmax/exact_integrated.py")
          text = path.read_text()
          old = "innovation_dim = transformed_model.innovation_dim"
          new = "innovation_dim = int(transformed_model.selection.shape[1])"
          if old not in text:
              raise SystemExit("innovation dimension line not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - run: python -m black src/pystarmax/exact_integrated.py tests/test_exact_integrated.py
      - run: python -m isort src/pystarmax/exact_integrated.py tests/test_exact_integrated.py src/pystarmax/__init__.py
      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-exact-integrated.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pystarmax/exact_integrated.py tests/test_exact_integrated.py src/pystarmax/__init__.py
          git commit -m "Fix exact integrated innovation dimension"
          git push
