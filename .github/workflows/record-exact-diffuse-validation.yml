name: Record exact diffuse validation

on:
  push:
    branches:
      - agent/exact-diffuse-kalman

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exact-diffuse-kalman
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Update validation records
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          status_path = Path("PROJECT_STATUS.md")
          status = status_path.read_text()
          start = status.index("## Core validation for 0.0.19")
          end = status.index("## Validation references")
          validation = '''## Authoritative validation for 0.0.19

          GitHub Actions CI #422, run ID `30880321271`, validated the complete
          implementation, tests, example, metadata, README, documentation home,
          navigation, state-space guide, conditional-integrated guide, roadmap, project
          status, and Step 19 documentation head:

          - 169 tests passed in the coverage job;
          - total branch coverage was 87.12%, above the required 80%;
          - `src/pystarmax/exact_diffuse.py` coverage was 87.8%;
          - `src/pystarmax/exact_integrated.py` coverage was 86.9%;
          - Black, isort, Ruff, and mypy passed;
          - independent diagnostic-reference regeneration produced a clean diff;
          - strict MkDocs passed;
          - source distribution, wheel, and Twine checks passed;
          - Ubuntu, Windows, and macOS passed on Python 3.11, 3.12, 3.13, and 3.14.

          A validation-record-only merge-gate CI is required after this status and the
          Step 19 handoff are updated. No implementation, test, API, example, README, or
          method-guide changes are made after CI #422.

          '''
          status = status[:start] + validation + status[end:]
          old_tasks = '''## Immediate next tasks

          1. Run complete CI on the synchronized documentation head.
          2. Record the authoritative final test count, coverage, and run identifier.
          3. Update PR #19, mark it ready, and squash-merge it into `main`.
          4. Add optimizer-facing exact diffuse ordinary STARIMA maximum likelihood.
          5. Add exact diffuse fixed-interval smoothing and disturbance smoothing.
          6. Add ordinary-seasonal diffuse state augmentation.
          7. Add parameter-aware Kalman paths, sparse state matrices, cross-time
             innovation covariance, simulation smoothing, order selection, exogenous
             inputs, adapters, and cross-language fixtures.
          '''
          new_tasks = '''## Immediate next tasks

          1. Run the validation-record-only merge-gate CI.
          2. Update PR #19, mark it ready, and squash-merge it into `main`.
          3. Add optimizer-facing exact diffuse ordinary STARIMA maximum likelihood.
          4. Add exact diffuse fixed-interval smoothing and disturbance smoothing.
          5. Add ordinary-seasonal diffuse state augmentation.
          6. Add parameter-aware Kalman paths, sparse state matrices, cross-time
             innovation covariance, simulation smoothing, order selection, exogenous
             inputs, adapters, and cross-language fixtures.
          '''
          if old_tasks not in status:
              raise SystemExit("PROJECT_STATUS immediate tasks block not found")
          status_path.write_text(status.replace(old_tasks, new_tasks, 1))

          step_path = Path("docs/development/STEP_19_EXACT_DIFFUSE.md")
          step = step_path.read_text()
          old_position = '''- core validation: GitHub Actions CI #416, run ID `30879751296`;
          - core result: 169 tests passed and 87.12% total branch coverage;
          - `src/pystarmax/exact_diffuse.py` coverage: 87.8%;
          - `src/pystarmax/exact_integrated.py` coverage: 86.9%;
          - a complete final documentation-head CI is required before merge.
          '''
          new_position = '''- authoritative implementation/documentation validation: GitHub Actions CI
            #422, run ID `30880321271`;
          - validation result: 169 tests passed and 87.12% total branch coverage;
          - `src/pystarmax/exact_diffuse.py` coverage: 87.8%;
          - `src/pystarmax/exact_integrated.py` coverage: 86.9%;
          - Black, isort, Ruff, mypy, strict MkDocs, distributions, and Ubuntu/Windows/
            macOS Python 3.11–3.14 all passed;
          - a validation-record-only merge-gate CI is required before merge.
          '''
          if old_position not in step:
              raise SystemExit("Step 19 repository position block not found")
          step = step.replace(old_position, new_position, 1)
          old_ci = '''Core CI #416 reported:

          - 169 tests passed in 48.19 seconds;
          - total branch coverage: 87.12%;
          - exact diffuse module coverage: 87.8%;
          - exact integrated module coverage: 86.9%;
          - Black, isort, Ruff, mypy, strict MkDocs, distributions, and diagnostic fixture
            regeneration passed;
          - Ubuntu and macOS passed on Python 3.11 through 3.14;
          - Windows completion is confirmed by the final documentation-head CI before
            merge.
          '''
          new_ci = '''Authoritative CI #422 reported:

          - 169 tests passed in 61.57 seconds in the coverage job;
          - total branch coverage: 87.12%;
          - exact diffuse module coverage: 87.8%;
          - exact integrated module coverage: 86.9%;
          - Black, isort, Ruff, mypy, strict MkDocs, distributions, and diagnostic fixture
            regeneration passed;
          - Ubuntu, Windows, and macOS passed on Python 3.11, 3.12, 3.13, and 3.14.

          The validation-record-only head changes only this handoff and
          `PROJECT_STATUS.md`. It receives one final merge-gate CI before PR #19 is
          marked ready and merged.
          '''
          if old_ci not in step:
              raise SystemExit("Step 19 validation block not found")
          step_path.write_text(step.replace(old_ci, new_ci, 1))
          PY
      - name: Commit records and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/record-exact-diffuse-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATUS.md docs/development/STEP_19_EXACT_DIFFUSE.md
          git commit -m "Record final exact diffuse validation"
          git push
