name: Export exact diffuse smoothing API

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  export:
    if: github.event.pull_request.head.ref == 'agent/exact-diffuse-smoothing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exact-diffuse-smoothing
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Update package exports and metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/pystarmax/__init__.py")
          text = path.read_text()
          text = text.replace('__version__ = "0.0.20"', '__version__ = "0.0.21"', 1)
          old = '''from pystarmax.exact_diffuse_mle import (
              ExactDiffuseKalmanSTARIMA,
              ExactDiffuseKalmanSTARIMAResult,
          )
          '''
          new = '''from pystarmax.exact_diffuse_model import (
              ExactDiffuseKalmanSTARIMA,
              ExactDiffuseKalmanSTARIMAResult,
          )
          from pystarmax.exact_diffuse_smoothing import (
              ExactDiffuseSmootherResult,
              exact_diffuse_smoother,
          )
          '''
          if old not in text:
              raise SystemExit("exact diffuse MLE import block not found")
          text = text.replace(old, new, 1)
          marker = '    "ExactDiffuseKalmanSTARIMAResult",\n'
          if marker not in text:
              raise SystemExit("exact diffuse result export not found")
          text = text.replace(
              marker,
              marker + '    "ExactDiffuseSmootherResult",\n',
              1,
          )
          marker = '    "exact_diffuse_loglikelihood",\n'
          if marker not in text:
              raise SystemExit("exact diffuse function export not found")
          text = text.replace(
              marker,
              marker + '    "exact_diffuse_smoother",\n',
              1,
          )
          path.write_text(text)

          citation = Path("CITATION.cff")
          citation_text = citation.read_text()
          if "version: 0.0.20" not in citation_text:
              raise SystemExit("citation version not found")
          citation.write_text(
              citation_text.replace("version: 0.0.20", "version: 0.0.21", 1)
          )
          PY
      - name: Format exports
        shell: bash
        run: |
          python -m pip install isort==8.0.1
          python -m isort src/pystarmax/__init__.py
      - name: Commit exports and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/export-exact-diffuse-smoothing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pystarmax/__init__.py CITATION.cff
          git commit -m "Export exact diffuse smoothing API"
          git push
