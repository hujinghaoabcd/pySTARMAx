name: Format exact diffuse inference example

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'agent/exact-diffuse-inference'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exact-diffuse-inference
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Format example
        run: |
          python -m pip install black==26.5.1
          python -m black examples/exact_diffuse_inference.py
          rm .github/workflows/format-exact-diffuse-inference-example.yml
      - name: Commit formatted example
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Format exact diffuse inference example"
          git push origin HEAD:agent/exact-diffuse-inference
