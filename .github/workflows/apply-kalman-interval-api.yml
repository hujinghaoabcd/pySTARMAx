name: Apply Kalman interval API

on:
  push:
    branches:
      - agent/kalman-original-scale-intervals

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kalman-original-scale-intervals
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Patch integrated and seasonal APIs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          integrated_path = Path("src/pystarmax/integrated_maximum_likelihood.py")
          integrated = integrated_path.read_text()
          old = """from pystarmax.differencing import DifferencingState, differencing_coefficients
          from pystarmax.innovation_smoothing import InnovationDisturbanceResult
          """
          new = """from pystarmax.differencing import DifferencingState, differencing_coefficients
          from pystarmax.forecasting import ForecastInterval
          from pystarmax.innovation_smoothing import InnovationDisturbanceResult
          from pystarmax.kalman_forecasting import (
              integrated_kalman_forecast_interval,
              kalman_forecast_interval,
          )
          """
          if old not in integrated:
              raise SystemExit("integrated import block not found")
          integrated = integrated.replace(old, new, 1)
          old = """    def predict_differenced(self, steps: int = 1) -> FloatArray:
              \"\"\"Return recursive means on the highest ordinary-difference scale.\"\"\"
              self._require_fit()
              return self.core_model.predict(steps=steps)

              def predict(self, steps: int = 1) -> FloatArray:
          """
          new = """    def predict_differenced(self, steps: int = 1) -> FloatArray:
              \"\"\"Return recursive means on the highest ordinary-difference scale.\"\"\"
              self._require_fit()
              return self.core_model.predict(steps=steps)

              def predict_differenced_interval(
                  self,
                  steps: int = 1,
                  *,
                  level: float = 0.95,
                  n_simulations: int = 2000,
                  random_state: int | np.random.Generator | None = None,
              ) -> ForecastInterval:
                  \"\"\"Return a Gaussian interval on the highest difference scale.\"\"\"
                  self._require_fit()
                  return kalman_forecast_interval(
                      self.filter(),
                      steps=steps,
                      level=level,
                      n_simulations=n_simulations,
                      random_state=random_state,
                  )

              def predict_interval(
                  self,
                  steps: int = 1,
                  *,
                  level: float = 0.95,
                  n_simulations: int = 2000,
                  random_state: int | np.random.Generator | None = None,
              ) -> ForecastInterval:
                  \"\"\"Return an original-scale pathwise inverse-differenced interval.\"\"\"
                  self._require_fit()
                  if self.differencing_state_ is None:
                      raise RuntimeError(
                          \"original-scale interval prediction requires finite terminal \"
                          \"differencing anchors; use predict_differenced_interval() or \"
                          \"refit with finite trailing data\"
                      )
                  return integrated_kalman_forecast_interval(
                      self.filter(),
                      self.differencing_state_,
                      steps=steps,
                      level=level,
                      n_simulations=n_simulations,
                      random_state=random_state,
                  )

              def predict(self, steps: int = 1) -> FloatArray:
          """
          if old not in integrated:
              raise SystemExit("integrated prediction block not found")
          integrated = integrated.replace(old, new, 1)
          integrated_path.write_text(integrated)

          seasonal_path = Path("src/pystarmax/seasonal_maximum_likelihood.py")
          seasonal = seasonal_path.read_text()
          old = """from pystarmax.differencing import (
              CombinedDifferencingState,
              DifferencingState,
              SeasonalDifferencingState,
              differencing_coefficients,
          )
          from pystarmax.innovation_smoothing import (
          """
          new = """from pystarmax.differencing import (
              CombinedDifferencingState,
              DifferencingState,
              SeasonalDifferencingState,
              differencing_coefficients,
          )
          from pystarmax.forecasting import ForecastInterval
          from pystarmax.innovation_smoothing import (
          """
          if old not in seasonal:
              raise SystemExit("seasonal forecasting import position not found")
          seasonal = seasonal.replace(old, new, 1)
          old = """from pystarmax.innovation_smoothing import (
              InnovationDisturbanceResult,
              innovation_disturbance_smoother,
          )
          from pystarmax.seasonal import LagOperator, expand_multiplicative_operators
          """
          new = """from pystarmax.innovation_smoothing import (
              InnovationDisturbanceResult,
              innovation_disturbance_smoother,
          )
          from pystarmax.kalman_forecasting import (
              integrated_kalman_forecast_interval,
              kalman_forecast_interval,
          )
          from pystarmax.seasonal import LagOperator, expand_multiplicative_operators
          """
          if old not in seasonal:
              raise SystemExit("seasonal Kalman import position not found")
          seasonal = seasonal.replace(old, new, 1)
          old = """    def predict_differenced(self, steps: int = 1) -> FloatArray:
              steps = validate_nonnegative_int(steps, name=\"steps\")
              if steps == 0:
                  raise ValueError(\"steps must be positive\")
              _result, state_space, filtered = self._require_fit()
              state = filtered.filtered_state[-1].copy()
              forecasts = np.empty((steps, state_space.n_locations), dtype=float)
              for step_index in range(steps):
                  state = state_space.state_intercept + state_space.transition @ state
                  forecasts[step_index] = state_space.design @ state
              return cast(FloatArray, forecasts)

              def predict(self, steps: int = 1) -> FloatArray:
          """
          new = """    def predict_differenced(self, steps: int = 1) -> FloatArray:
              steps = validate_nonnegative_int(steps, name=\"steps\")
              if steps == 0:
                  raise ValueError(\"steps must be positive\")
              _result, state_space, filtered = self._require_fit()
              state = filtered.filtered_state[-1].copy()
              forecasts = np.empty((steps, state_space.n_locations), dtype=float)
              for step_index in range(steps):
                  state = state_space.state_intercept + state_space.transition @ state
                  forecasts[step_index] = state_space.design @ state
              return cast(FloatArray, forecasts)

              def predict_differenced_interval(
                  self,
                  steps: int = 1,
                  *,
                  level: float = 0.95,
                  n_simulations: int = 2000,
                  random_state: int | np.random.Generator | None = None,
              ) -> ForecastInterval:
                  \"\"\"Return a Gaussian interval on the combined transformed scale.\"\"\"
                  self._require_fit()
                  return kalman_forecast_interval(
                      self.filter(),
                      steps=steps,
                      level=level,
                      n_simulations=n_simulations,
                      random_state=random_state,
                  )

              def predict_interval(
                  self,
                  steps: int = 1,
                  *,
                  level: float = 0.95,
                  n_simulations: int = 2000,
                  random_state: int | np.random.Generator | None = None,
              ) -> ForecastInterval:
                  \"\"\"Return an original-scale pathwise inverse-differenced interval.\"\"\"
                  self._require_fit()
                  if self.differencing_state_ is None:
                      raise RuntimeError(
                          \"original-scale interval prediction requires finite ordinary \"
                          \"and seasonal terminal histories; use \"
                          \"predict_differenced_interval() or refit with finite trailing data\"
                      )
                  return integrated_kalman_forecast_interval(
                      self.filter(),
                      self.differencing_state_,
                      steps=steps,
                      level=level,
                      n_simulations=n_simulations,
                      random_state=random_state,
                  )

              def predict(self, steps: int = 1) -> FloatArray:
          """
          if old not in seasonal:
              raise SystemExit("seasonal prediction block not found")
          seasonal = seasonal.replace(old, new, 1)
          seasonal_path.write_text(seasonal)

          init_path = Path("src/pystarmax/__init__.py")
          init = init_path.read_text().replace('__version__ = "0.0.17"', '__version__ = "0.0.18"', 1)
          old = """from pystarmax.forecasting import ForecastInterval
          from pystarmax.innovation_smoothing import (
          """
          new = """from pystarmax.forecasting import ForecastInterval
          from pystarmax.innovation_smoothing import (
          """
          if old not in init:
              raise SystemExit("public forecasting import position not found")
          init = init.replace(old, new, 1)
          marker = """from pystarmax.integrated_maximum_likelihood import (
              KalmanSTARIMA,
              KalmanSTARIMAResult,
          )
          """
          addition = marker + """from pystarmax.kalman_forecasting import (
              ForecastInverter,
              integrated_kalman_forecast_interval,
              inverse_forecast_paths,
              kalman_forecast_interval,
              simulate_kalman_forecast_paths,
          )
          """
          if marker not in init:
              raise SystemExit("public Kalman import marker not found")
          init = init.replace(marker, addition, 1)
          old = '    "ForecastInterval",\n'
          new = old + '    "ForecastInverter",\n'
          if old not in init:
              raise SystemExit("ForecastInterval export not found")
          init = init.replace(old, new, 1)
          old = '    "rolling_origin_evaluate",\n'
          new = old + """    "simulate_kalman_forecast_paths",
              "kalman_forecast_interval",
              "integrated_kalman_forecast_interval",
              "inverse_forecast_paths",
          """
          if old not in init:
              raise SystemExit("rolling-origin export marker not found")
          init = init.replace(old, new, 1)
          init_path.write_text(init)

          citation_path = Path("CITATION.cff")
          citation = citation_path.read_text()
          if "version: 0.0.17" not in citation:
              raise SystemExit("citation version not found")
          citation_path.write_text(citation.replace("version: 0.0.17", "version: 0.0.18", 1))
          PY
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/apply-kalman-interval-api.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pystarmax/integrated_maximum_likelihood.py \
            src/pystarmax/seasonal_maximum_likelihood.py \
            src/pystarmax/__init__.py CITATION.cff
          git commit -m "Add original-scale Kalman interval APIs"
          git push
