name: Diagnose seasonal inference

on:
  push:
    branches:
      - agent/seasonal-likelihood-inference

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seasonal-likelihood-inference
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev,docs,test]"
      - name: Run focused diagnostics
        shell: bash
        run: |
          set +e
          : > ci-seasonal-inference-diagnostic.txt
          for command in \
            "python -m black --check src/pystarmax/seasonal_likelihood_inference.py tests/test_seasonal_likelihood_inference.py" \
            "python -m isort --check-only src/pystarmax/seasonal_likelihood_inference.py tests/test_seasonal_likelihood_inference.py" \
            "python -m ruff check src/pystarmax/seasonal_likelihood_inference.py tests/test_seasonal_likelihood_inference.py" \
            "python -m mypy" \
            "python -m pytest tests/test_seasonal_likelihood_inference.py -q"
          do
            echo "===== $command =====" >> ci-seasonal-inference-diagnostic.txt
            bash -lc "$command" >> ci-seasonal-inference-diagnostic.txt 2>&1
            echo "EXIT_CODE=$?" >> ci-seasonal-inference-diagnostic.txt
            echo >> ci-seasonal-inference-diagnostic.txt
          done
          exit 0
      - name: Commit diagnostic and remove workflow
        shell: bash
        run: |
          git rm -f .github/workflows/diagnose-seasonal-inference.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-seasonal-inference-diagnostic.txt
          git commit -m "Record seasonal inference diagnostics"
          git push
