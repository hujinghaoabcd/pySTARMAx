name: Format exact diffuse smoothing

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'agent/exact-diffuse-smoothing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exact-diffuse-smoothing
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install black==26.5.1 isort==8.0.1
      - run: python -m black src/pystarmax/exact_diffuse_smoothing.py
      - run: python -m isort src/pystarmax/exact_diffuse_smoothing.py
      - name: Commit formatting
        shell: bash
        run: |
          git rm .github/workflows/format-exact-diffuse-smoothing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pystarmax/exact_diffuse_smoothing.py
          git commit -m "Format exact diffuse smoothing"
          git push
