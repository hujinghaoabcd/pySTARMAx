name: Synchronize exact diffuse smoothing docs

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.ref == 'agent/exact-diffuse-smoothing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exact-diffuse-smoothing
      - name: Update documentation surfaces
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, label: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"{label} not found in {path}")
              file.write_text(text.replace(old, new, 1))

          replace(
              "README.md",
              '''> **Status — 0.0.20:** stationary, conditional ordinary-integrated,
          > exact-diffuse ordinary-integrated, and multiplicative seasonal Gaussian
          > Kalman STARMA/STARIMA estimation; expanded AR stationarity and positive-sign
          > MA invertibility diagnostics; observed-information Hessian and natural
          > covariance inference; missing-data filtering; RTS state and original
          > innovation smoothing; fixed-parameter Gaussian forecast intervals with
          > pathwise ordinary/seasonal reconstruction; and optimizer-facing exact
          > diffuse ordinary STARIMA likelihood on original levels. Exact diffuse
          > smoothing/inference, seasonal diffuse augmentation, sparse computation,
          > exogenous regressors, and time-varying extensions remain planned.
          ''',
              '''> **Status — 0.0.21:** stationary, conditional ordinary-integrated,
          > exact-diffuse ordinary-integrated, and multiplicative seasonal Gaussian
          > Kalman STARMA/STARIMA estimation; expanded AR stationarity and positive-sign
          > MA invertibility diagnostics; observed-information Hessian and natural
          > covariance inference; missing-data filtering; ordinary RTS and exact diffuse
          > fixed-interval state smoothing; original innovation smoothing for the
          > ordinary finite-initialization route; fixed-parameter Gaussian forecast
          > intervals; and optimizer-facing exact diffuse ordinary STARIMA likelihood.
          > Exact diffuse lag-one/disturbance smoothing and inference, seasonal diffuse
          > augmentation, sparse computation, exogenous regressors, and time-varying
          > extensions remain planned.
          ''',
              "README status",
          )
          replace(
              "README.md",
              '''print(exact_mle_result.summary())
          print(exact_mle_result.filter_result.filtered_diffuse_rank)
          print(exact_mle.predict(steps=6))
          ```
          ''',
              '''print(exact_mle_result.summary())
          print(exact_mle_result.filter_result.filtered_diffuse_rank)
          print(exact_mle.predict(steps=6))
          exact_smoothed = exact_mle.smooth()
          print(exact_smoothed.smoothed_observations)
          print(exact_smoothed.smoothed_covariance)
          ```
          ''',
              "README exact smoothing example",
          )
          replace(
              "README.md",
              '''[`docs/exact_diffuse.md`](docs/exact_diffuse.md) and
          [`docs/exact_diffuse_mle.md`](docs/exact_diffuse_mle.md).
          ''',
              '''[`docs/exact_diffuse.md`](docs/exact_diffuse.md),
          [`docs/exact_diffuse_mle.md`](docs/exact_diffuse_mle.md), and
          [`docs/exact_diffuse_smoothing.md`](docs/exact_diffuse_smoothing.md).
          ''',
              "README exact guide links",
          )
          replace(
              "README.md",
              '''- exact diffuse observed-information inference and smoothing are unavailable;
          - seasonal diffuse augmentation is unavailable;
          ''',
              '''- exact diffuse state marginal smoothing is available, but lag-one state
            covariance, disturbance smoothing, and simulation smoothing are unavailable;
          - exact diffuse observed-information inference is unavailable;
          - seasonal diffuse augmentation and smoothing are unavailable;
          ''',
              "README limitations",
          )

          replace(
              "docs/index.md",
              '''integrated level-state likelihood, conditional and bootstrap intervals, and
          rolling-origin calibration diagnostics.
          ''',
              '''integrated level-state likelihood, exact diffuse fixed-interval state
          smoothing, conditional and bootstrap intervals, and rolling-origin calibration
          diagnostics.
          ''',
              "docs index intro",
          )
          replace(
              "docs/index.md",
              '''print(exact_integrated_result.summary())
          print(exact_integrated_mle.predict(steps=6))
          ''',
              '''print(exact_integrated_result.summary())
          print(exact_integrated_mle.predict(steps=6))
          exact_smoothed = exact_integrated_mle.smooth()
          print(exact_smoothed.smoothed_observations)
          ''',
              "docs index exact smoothing example",
          )
          replace(
              "docs/index.md",
              '''documents optimizer reconstruction on original levels. The conditional
          `KalmanSTARIMA` likelihood remains a separate API.
          ''',
              '''documents optimizer reconstruction on original levels. [Exact diffuse
          smoothing](exact_diffuse_smoothing.md) documents the backward `r`, `r_inf`,
          `N`, `N1`, and `N2` recursions and finite posterior state moments. The
          conditional `KalmanSTARIMA` likelihood remains a separate API.
          ''',
              "docs index exact smoothing paragraph",
          )

          replace(
              "docs/exact_diffuse_mle.md",
              '''These are fixed-parameter point forecasts. Version 0.0.20 does not yet expose
          exact-diffuse-model interval simulation through this estimator.
          ''',
              '''These are fixed-parameter point forecasts. Forecast interval simulation from
          the exact diffuse estimator is not yet exposed.
          
          ## Fixed-interval state smoothing
          
          Version 0.0.21 adds:
          
          ```python
          smoothed = model.smooth()
          new_smoothed = model.smooth(new_level_observations)
          ```
          
          The exact diffuse smoother propagates ordinary and diffuse backward
          information quantities separately and returns marginal smoothed state and
          observation moments. Smoothing new data starts a new diffuse initialization;
          it does not continue the training posterior. See
          [Exact diffuse smoothing](exact_diffuse_smoothing.md).
          ''',
              "exact MLE smoothing section",
          )
          replace(
              "docs/exact_diffuse_mle.md",
              '''- exact diffuse smoothing is not yet implemented;
          - seasonal diffuse state augmentation is not yet implemented;
          ''',
              '''- exact diffuse marginal state smoothing is available, but lag-one state
            covariance and disturbance smoothing are not;
          - seasonal diffuse state augmentation and smoothing are not implemented;
          ''',
              "exact MLE limitations",
          )

          replace(
              "docs/exact_diffuse.md",
              '''Version 0.0.20 adds `ExactDiffuseKalmanSTARIMA`, which rebuilds the
          transformed STARMA state, integrated level state, and exact diffuse likelihood
          at every optimizer candidate. It is documented in
          [Exact diffuse STARIMA maximum likelihood](exact_diffuse_mle.md). The
          conditional `KalmanSTARIMA` estimator remains unchanged.
          ''',
              '''Version 0.0.20 adds `ExactDiffuseKalmanSTARIMA`, which rebuilds the
          transformed STARMA state, integrated level state, and exact diffuse likelihood
          at every optimizer candidate. Version 0.0.21 adds exact diffuse fixed-interval
          marginal state smoothing through the fitted estimator and low-level
          `exact_diffuse_smoother()`. See
          [Exact diffuse STARIMA maximum likelihood](exact_diffuse_mle.md) and
          [Exact diffuse smoothing](exact_diffuse_smoothing.md). The conditional
          `KalmanSTARIMA` estimator remains unchanged.
          ''',
              "exact diffuse smoothing cross-reference",
          )
          replace(
              "docs/exact_diffuse.md",
              '''- exact diffuse smoothing is not yet implemented;
          - seasonal diffuse state augmentation is not yet implemented;
          ''',
              '''- exact diffuse marginal state smoothing is implemented, but lag-one state
            covariance, disturbance smoothing, and simulation smoothing are not;
          - seasonal diffuse state augmentation and smoothing are not implemented;
          ''',
              "exact diffuse limitations",
          )

          roadmap_path = Path("docs/roadmap.md")
          roadmap = roadmap_path.read_text()
          marker = "## Next priorities\n"
          if marker not in roadmap:
              raise SystemExit("roadmap next priorities marker not found")
          roadmap = roadmap.replace(
              marker,
              '''## Implemented in 0.0.21: exact diffuse fixed-interval smoothing
          
          - exact diffuse backward information recursions for `r`, `r_inf`, `N`, `N1`,
            and `N2`;
          - smoothed state means from finite and diffuse covariance components;
          - finite posterior state covariance with all ordinary/diffuse cross terms;
          - smoothed observation means and covariance;
          - forward scalar finite/diffuse covariance reconstruction diagnostics;
          - PSD stabilization diagnostics without a production diffuse scale;
          - missing-row, leading-missing, and partial-location smoothing;
          - stationary zero-diffuse equivalence with ordinary RTS smoothing;
          - random-walk bridge and large-variance-limit references;
          - fitted `ExactDiffuseKalmanSTARIMA.smooth()` for training and new data;
          - explicit omission of lag-one, disturbance, and simulation smoothing until the
            full diffuse autocovariance recursion is implemented;
          - method guide, runnable example, navigation, README, status, and Step 21
            handoff.
          
          ## Next priorities
          ''',
              1,
          )
          old_priorities = '''1. Exact diffuse fixed-interval smoothing and disturbance smoothing.
          2. Exact diffuse observed-information and natural covariance inference.
          3. Seasonal ordinary-seasonal diffuse state augmentation.
          4. Forecast intervals for the exact diffuse estimator.
          5. Parameter-aware Kalman paths and sparse state matrices.
          6. Cross-time innovation covariance and simulation smoothing.
          7. Smooth admissibility parameterization and automatic order selection.
          8. Exogenous regressors, GIS adapters, cross-language fixtures, PyPI release,
             parallel execution, robust inference, and time-varying extensions.
          '''
          new_priorities = '''1. Exact diffuse lag-one state covariance and disturbance smoothing.
          2. Exact diffuse observed-information and natural covariance inference.
          3. Exact diffuse simulation smoothing.
          4. Seasonal ordinary-seasonal diffuse state augmentation and smoothing.
          5. Forecast intervals for the exact diffuse estimator.
          6. Parameter-aware paths, sparse state matrices, and cross-time innovation
             covariance.
          7. Smooth admissibility parameterization and automatic order selection.
          8. Exogenous regressors, GIS adapters, cross-language fixtures, PyPI release,
             parallel execution, robust inference, and time-varying extensions.
          '''
          if old_priorities not in roadmap:
              raise SystemExit("roadmap priorities not found")
          roadmap_path.write_text(roadmap.replace(old_priorities, new_priorities, 1))

          status_path = Path("PROJECT_STATUS.md")
          status = status_path.read_text()
          old_state = '''- PR #1 through PR #19 have been squash-merged into `main`.
          - `main` is version `0.0.19` at merge commit
            `405b9886f446330e5adf479e03ccb595b95740eb`.
          - Current branch: `agent/exact-diffuse-mle`.
          - Current draft pull request: PR #20, `Add exact diffuse STARIMA maximum
            likelihood`.
          - Current development version: `0.0.20`.
          - The branch adds optimizer-facing ordinary STARIMA maximum likelihood on the
            original level process using exact diffuse initialization.
          - Conditional `KalmanSTARIMA` remains available and keeps its existing
            differenced conditional likelihood; it is not silently redefined.
          '''
          new_state = '''- PR #1 through PR #20 have been squash-merged into `main`.
          - `main` is version `0.0.20` at merge commit
            `36edc8b37f56e456aef1daa2df7aa496a07f13fb`.
          - Current branch: `agent/exact-diffuse-smoothing`.
          - Current draft pull request: PR #21, `Add exact diffuse fixed-interval
            smoothing`.
          - Current development version: `0.0.21`.
          - The branch adds exact diffuse marginal state and observation smoothing through
            backward ordinary/diffuse information recursions.
          - Lag-one state covariance, disturbance smoothing, and simulation smoothing are
            explicitly outside this stage.
          '''
          if old_state not in status:
              raise SystemExit("PROJECT_STATUS repository state block not found")
          status = status.replace(old_state, new_state, 1)
          marker = "## Authoritative validation for 0.0.20\n"
          if marker not in status:
              raise SystemExit("PROJECT_STATUS validation marker not found")
          section = '''## Completed in 0.0.21
          
          ### Exact diffuse backward information smoothing
          
          - retains ordinary estimator `r` and diffuse estimator `r_inf`;
          - retains ordinary covariance `N`, cross covariance `N1`, and second diffuse
            covariance `N2`;
          - reconstructs every sequential forward scalar covariance update;
          - reports maximum discrepancy against retained filter covariance;
          - computes smoothed means as `a + P_* r + P_inf r_inf`;
          - computes finite posterior covariance with ordinary, diffuse, and both cross
            correction terms;
          - returns smoothed observation means and covariance;
          - propagates future information through fully missing and partially observed
            rows;
          - stabilizes only floating-point-scale negative covariance eigenvalues and
            reports the largest correction;
          - exposes immutable backward information arrays and diagnostics;
          - integrates as `ExactDiffuseKalmanSTARIMA.smooth()` for training or newly
            initialized data.
          
          ### Validation scope
          
          Tests cover closed-form random-walk bridges, leading missing levels,
          zero-diffuse equality with stationary RTS smoothing, a local-linear-trend
          large-variance limit, partial locations, observed-cell reconstruction, PSD
          covariance, immutable arrays, forward covariance reconstruction, and the
          fitted-model smoothing facade.
          
          ### Deliberate boundary
          
          Version 0.0.21 does not fabricate lag-one exact diffuse state covariance. The
          diffuse autocovariance recursion needs an additional higher-order transition
          term beyond retained `L0` and `L1`. State-disturbance, original innovation, and
          simulation smoothing remain future stages.
          
          ## Core validation for 0.0.21
          
          GitHub Actions CI #455, run ID `30885891151`, validated the numerical core,
          public exports, model facade, primary method guide, packaging, and full
          cross-platform matrix:
          
          - 184 tests passed in the coverage job;
          - total branch coverage was 87.16%, above the required 80%;
          - `src/pystarmax/exact_diffuse_smoothing.py` coverage was 91.6%;
          - `src/pystarmax/exact_diffuse_mle.py` coverage was 84.3%;
          - `src/pystarmax/exact_diffuse.py` coverage was 87.8%;
          - `src/pystarmax/exact_integrated.py` coverage was 86.9%;
          - Black, isort, Ruff, and mypy passed;
          - independent diagnostic-reference regeneration produced a clean diff;
          - strict MkDocs passed;
          - source distribution, wheel, and Twine checks passed;
          - Ubuntu, Windows, and macOS passed on Python 3.11, 3.12, 3.13, and 3.14.
          
          A complete final CI is required on the synchronized documentation head. The
          authoritative final run must be recorded before merge.
          
          '''
          status = status.replace(marker, section + marker, 1)
          old_tasks = '''## Immediate next tasks
          
          1. Run the validation-record-only merge-gate CI.
          2. Update PR #20, mark it ready, and squash-merge it into `main`.
          3. Add exact diffuse fixed-interval smoothing and disturbance smoothing.
          4. Add exact diffuse observed-information and natural covariance inference.
          5. Add ordinary-seasonal diffuse state augmentation.
          6. Add forecast intervals for the exact diffuse estimator.
          7. Add sparse state matrices, parameter-aware forecast paths, cross-time
             innovation covariance, simulation smoothing, order selection, exogenous
             inputs, GIS adapters, and cross-language fixtures.
          '''
          new_tasks = '''## Immediate next tasks
          
          1. Run complete CI on the synchronized documentation head.
          2. Record the authoritative final run identifier, test count, and coverage.
          3. Update PR #21, mark it ready, and squash-merge it into `main`.
          4. Add exact diffuse lag-one state covariance and disturbance smoothing.
          5. Add exact diffuse observed-information and natural covariance inference.
          6. Add exact diffuse simulation smoothing and seasonal diffuse augmentation.
          7. Add forecast intervals, sparse state matrices, parameter-aware paths,
             cross-time innovation covariance, order selection, exogenous inputs, GIS
             adapters, and cross-language fixtures.
          '''
          if old_tasks not in status:
              raise SystemExit("PROJECT_STATUS tasks block not found")
          status = status.replace(old_tasks, new_tasks, 1)
          old_limits = '''- exact diffuse observed-information and natural covariance inference are not
            implemented;
          - exact diffuse smoothing and disturbance smoothing are not implemented;
          - seasonal ordinary-seasonal diffuse augmentation is not implemented;
          '''
          new_limits = '''- exact diffuse observed-information and natural covariance inference are not
            implemented;
          - exact diffuse marginal state smoothing is implemented, but lag-one state
            covariance, state/innovation disturbance smoothing, and simulation smoothing
            are not;
          - seasonal ordinary-seasonal diffuse augmentation and smoothing are not
            implemented;
          '''
          if old_limits not in status:
              raise SystemExit("PROJECT_STATUS limitations block not found")
          status = status.replace(old_limits, new_limits, 1)
          status = status.replace(
              '`docs/exact_diffuse_mle.md`, `docs/exact_diffuse.md`,\n',
              '`docs/exact_diffuse_smoothing.md`, `docs/exact_diffuse_mle.md`,\n`docs/exact_diffuse.md`,\n',
              1,
          )
          status_path.write_text(status)
          PY
      - name: Commit synchronized docs and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/sync-exact-diffuse-smoothing-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/index.md docs/exact_diffuse.md \
            docs/exact_diffuse_mle.md docs/roadmap.md PROJECT_STATUS.md
          git commit -m "Synchronize exact diffuse smoothing documentation"
          git push
