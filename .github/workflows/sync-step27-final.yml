name: Finalize Step 27 status

on:
  push:
    branches:
      - agent/seasonal-exact-diffuse-mle

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seasonal-exact-diffuse-mle
          fetch-depth: 0
      - name: Synchronize status
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def sub(path, pattern, replacement, count=1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              updated, n = re.subn(pattern, replacement, text, count=count, flags=re.S)
              if n != count:
                  raise RuntimeError(f"expected {count} replacement(s) in {path}, got {n}")
              p.write_text(updated, encoding="utf-8")

          sub(
              "README.md",
              r"> \*\*Status — 0\.0\.26:\*\*.*?extensions remain planned\.\n",
              "> **Status — 0.0.27:** stationary, conditional ordinary-integrated,\n"
              "> exact-diffuse ordinary-integrated, multiplicative seasonal Gaussian Kalman\n"
              "> STARIMA estimation, and optimizer-facing multiplicative seasonal exact diffuse\n"
              "> maximum likelihood on original levels for `(1-B)^d(1-B^s)^D`; factor-based\n"
              "> parameter counting and expanded admissibility. Seasonal exact diffuse posterior\n"
              "> operations, diffuse lag-one covariance, parameter-aware paths, sparse\n"
              "> computation, exogenous regressors, and time-varying extensions remain planned.\n",
          )

          sub(
              "docs/index.md",
              r"simulation of complete latent state paths, a fixed-parameter seasonal exact diffuse\noriginal-level state/filter/likelihood foundation, conditional and bootstrap intervals,\nand rolling-origin calibration diagnostics\.",
              "simulation of complete latent state paths, and optimizer-facing multiplicative\n"
              "seasonal exact diffuse maximum likelihood on the original scale, conditional and\n"
              "bootstrap intervals, and rolling-origin calibration diagnostics.",
          )
          sub(
              "docs/index.md",
              r"    SeasonalKalmanSTARIMA,\n    rolling_origin_evaluate,",
              "    SeasonalExactDiffuseKalmanSTARIMA,\n"
              "    SeasonalKalmanSTARIMA,\n"
              "    rolling_origin_evaluate,",
          )

          p = Path("PROJECT_STATUS.md")
          text = p.read_text(encoding="utf-8")
          start = text.index("## Repository state")
          end = text.index("## Public model families")
          repo_state = """## Repository state

- PR #1 through PR #26 have been squash-merged into `main`.
- `main` is version `0.0.26` at merge commit
  `e626ff330c2e6966d1474883656bf3543f56d84a`.
- Current branch: `agent/seasonal-exact-diffuse-mle`.
- Current draft pull request: PR #27,
  `Add seasonal exact diffuse maximum likelihood`.
- Current development version: `0.0.27`.
- PR #27 adds optimizer-facing original-level exact diffuse MLE for
  multiplicative `(p,d,q)x(P,D,Q)_s` factor models.
- Seasonal exact diffuse posterior operations remain outside this stage.

"""
          text = text[:start] + repo_state + text[end:]
          text = text.replace(
              "- fixed-parameter seasonal exact diffuse state specification through\n"
              "  `ExactSeasonalIntegratedStateSpace`.\n",
              "- fixed-parameter seasonal exact diffuse state specification through\n"
              "  `ExactSeasonalIntegratedStateSpace`;\n"
              "- optimizer-facing seasonal exact diffuse MLE through\n"
              "  `SeasonalExactDiffuseKalmanSTARIMA(p,d,q)x(P,D,Q)_s`.\n",
              1,
          )
          completed = """## Completed in 0.0.27

### Seasonal exact diffuse maximum likelihood

- optimizes ordinary and seasonal AR/MA factor coefficients rather than
  deterministic expanded cross-lag matrices;
- rebuilds the multiplicative expansion, stationary transformed state,
  original-level seasonal augmentation, and exact diffuse filter at every
  candidate;
- supports scalar, diagonal, and full-Cholesky innovation covariance;
- enforces admissibility on the full expanded AR and inverse-MA recursions;
- computes original-level exact diffuse likelihood, AIC, and BIC with
  factor-based parameter counting;
- exposes immutable fitted states, filtering, admissibility, and point forecasts.

Version 0.0.27 does not include seasonal exact diffuse smoothing, inference,
forecast intervals, simulation smoothing, parameter-aware paths, or sparse
execution.

"""
          marker = "## Numerical and research safeguards"
          if "## Completed in 0.0.27" not in text:
              text = text.replace(marker, completed + marker, 1)
          text = text.replace(
              "- seasonal exact diffuse fixed-parameter augmentation, filtering, and\n"
              "  original-level likelihood are available, but optimizer-facing MLE, smoothing,\n"
              "  inference, forecasting, and simulation facades are unavailable;",
              "- seasonal exact diffuse augmentation, filtering, original-level likelihood,\n"
              "  and optimizer-facing MLE are available, but smoothing, inference, forecast\n"
              "  intervals, and simulation-smoothing facades are unavailable;",
              1,
          )
          p.write_text(text, encoding="utf-8")

          p = Path("docs/roadmap.md")
          text = p.read_text(encoding="utf-8")
          marker = "## Next priorities"
          implemented = """## Implemented in 0.0.27: seasonal exact diffuse maximum likelihood

- optimizer-facing original-level exact diffuse multiplicative seasonal MLE;
- factor-parameter optimization with deterministic ordered cross-lag expansion;
- expanded stationarity and positive-sign inverse-MA admissibility;
- scalar, diagonal, and full-Cholesky covariance;
- factor-based AIC/BIC counting;
- immutable fitted state-space and exact-filter diagnostics;
- original-level and highest-difference point forecasts;
- closed-form, equivalence, missing-data, public-API, and cross-platform tests.

"""
          if "## Implemented in 0.0.27" not in text:
              text = text.replace(marker, implemented + marker, 1)
          start = text.index(marker)
          text = text[:start] + """## Next priorities

1. Seasonal exact diffuse fixed-interval state and primitive disturbance smoothing.
2. Seasonal exact diffuse likelihood and natural covariance inference.
3. Seasonal exact diffuse forecasts, paths, and intervals.
4. Diffuse `L2` lag-one covariance research and implementation.
5. Robust and parameter-aware uncertainty.
6. Sparse execution, model automation, exogenous inputs, GIS adapters, and release engineering.
"""
          p.write_text(text, encoding="utf-8")

          Path("docs/development/REMAINING_WORK.md").write_text(
              """# Remaining work inventory

## Snapshot

This inventory is based on `main` version 0.0.26 at
`e626ff330c2e6966d1474883656bf3543f56d84a` and draft PR #27 for version
0.0.27.

After Step 27, the plan contains **6 major technical workstreams**, **9 numbered
core milestones**, and roughly **14--18 separately reviewable projects**.

## Workstream 1: seasonal exact diffuse posterior operations

12. Add fixed-interval state and primitive disturbance smoothing.
13. Add observed-information and natural innovation-covariance inference.
14. Add original-level and transformed-scale forecasts, paths, and intervals.

All operations must reuse the 0.0.26 state augmentation and 0.0.27 fitted model
contract.

## Workstream 2: diffuse cross-time covariance theory

15. Derive and validate the diffuse `L2` lag-one state covariance recursion.
16. Expose cross-time disturbance and innovation covariance without finite
    large-variance substitution.

## Workstream 3: stronger likelihood and parameter uncertainty

17. Add robust/sandwich and profile-likelihood inference with boundary policies.
18. Propagate parameter uncertainty into forecasts and smoother summaries.

## Workstream 4: scalable numerical execution

19. Add sparse and memory-aware filtering, smoothing, forecasting, and simulation.
20. Add reproducible chunked or parallel execution with dense-reference checks.

## Workstream 5: model specification automation

- smooth admissibility parameterization;
- automatic temporal and spatial order selection;
- comparable reporting without mixing likelihood conventions.

## Workstream 6: exogenous inputs and ecosystem integration

- exogenous regressors and interventions;
- GIS adapters;
- cross-language reference fixtures;
- public release automation;
- explicitly time-varying models.

## Completion definition

Every milestone requires explicit mathematical contracts, immutable typed results,
independent numerical references, missing-data behavior, cross-platform tests,
quality and strict-documentation success, synchronized project documents, and a
clean review surface.
""",
              encoding="utf-8",
          )
          PY
      - name: Commit and remove helper
        shell: bash
        run: |
          git rm .github/workflows/sync-step27-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/index.md PROJECT_STATUS.md docs/roadmap.md docs/development/REMAINING_WORK.md
          git commit -m "Synchronize Step 27 project status"
          git push origin HEAD:agent/seasonal-exact-diffuse-mle
