name: Record Step 26 validation

on:
  push:
    branches:
      - agent/seasonal-exact-diffuse-state-space

permissions:
  contents: write

jobs:
  record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seasonal-exact-diffuse-state-space
          fetch-depth: 0
      - name: Record authoritative validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("PROJECT_STATUS.md")
          text = path.read_text(encoding="utf-8")
          validation = """## Authoritative validation for 0.0.26

GitHub Actions CI #560, run ID `30946774528`, validated the synchronized
implementation, tests, public exports, metadata, README, documentation home,
roadmap, remaining-work inventory, method guide, runnable example, MkDocs
navigation, project status, and Step 26 handoff on exact head
`a29e2538c12ca2b7e33a5e556dc37d080afacb72`.

Results:

- 223 tests passed in the coverage job;
- total branch coverage was 87.25%, above the required 80%;
- `src/pystarmax/exact_seasonal_integrated.py` branch coverage was 87.2%;
- the closed-form seasonal-random-walk likelihood reference passed;
- the explicit `(1-B)(1-B^2)` matrix reference passed;
- direct combined-difference residual recovery passed;
- exact `D=0` ordinary-integration equivalence passed;
- non-symmetric matrix-orientation checks for `Z @ T`, `Z @ R`, and `Z @ c`
  passed;
- missing-observation diffuse-rank and immutable-array contracts passed;
- Black, isort, Ruff, and mypy passed;
- independent diagnostic-reference regeneration produced a clean diff;
- strict MkDocs passed;
- source distribution, wheel, and Twine checks passed;
- Ubuntu, Windows, and macOS passed on Python 3.11, 3.12, 3.13, and 3.14.

A validation-record-only merge-gate CI is required after this status and the
Step 26 handoff are updated. No implementation, test, public API, example,
README, method-guide, or roadmap changes follow CI #560.

"""
          if "## Authoritative validation for 0.0.26" not in text:
              marker = "## Numerical and research safeguards"
              if marker not in text:
                  raise RuntimeError("PROJECT_STATUS safeguards marker missing")
              text = text.replace(marker, validation + marker, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit record and remove helper workflow
        shell: bash
        run: |
          git rm .github/workflows/record-step26-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATUS.md
          git commit -m "Record Step 26 authoritative validation"
          git push origin HEAD:agent/seasonal-exact-diffuse-state-space
