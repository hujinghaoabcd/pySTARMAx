name: Sort exact diffuse smoothing facade

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sort:
    if: github.event.pull_request.head.ref == 'agent/exact-diffuse-smoothing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exact-diffuse-smoothing
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install isort==8.0.1
      - run: python -m isort src/pystarmax/exact_diffuse_model.py
      - name: Commit sorting and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/isort-exact-diffuse-model.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pystarmax/exact_diffuse_model.py
          git commit -m "Sort exact diffuse smoothing facade imports"
          git push
