name: Record Step 25 validation

on:
  push:
    branches:
      - agent/exact-diffuse-simulation-smoothing

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exact-diffuse-simulation-smoothing
          fetch-depth: 0
      - name: Record authoritative validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("PROJECT_STATUS.md")
          text = path.read_text(encoding="utf-8")

          completed = """## Completed in 0.0.24

### Exact diffuse forecast intervals

- samples the finite exact diffuse terminal posterior only after final diffuse
  rank reaches zero;
- propagates future primitive innovations through the augmented original-level
  state;
- exposes original-level and highest ordinary-difference interval facades;
- retains deterministic recursive forecasts as interval means;
- conditions on fitted parameters.

## Completed in 0.0.25

### Exact diffuse conditional simulation smoothing

- represents the initial state using flat diffuse coordinates plus finite
  Gaussian source coordinates;
- adds later process innovations as proper Gaussian source coordinates;
- analytically eliminates identified diffuse coordinates;
- conditions the remaining standard-normal source vector through SVD;
- draws complete conditional state and observation paths without a finite
  diffuse scale;
- independently reconstructs posterior marginal means and covariance and checks
  them against the exact information smoother;
- exposes immutable path, rank, support-residual, and marginal-discrepancy
  diagnostics;
- integrates as `ExactDiffuseKalmanSTARIMA.simulate_smoothing_paths()`;
- is explicitly a dense moderate-sample reference implementation.

### Deliberate boundary

Version 0.0.25 does not claim diffuse lag-one autocovariance, primitive
innovation paths, cross-time disturbance covariance, seasonal diffuse
augmentation, parameter-aware paths, or sparse execution.

## Authoritative validation for 0.0.25

GitHub Actions CI #536, run ID `30944093465`, validated the synchronized
implementation, tests, public exports, fitted facade, example, metadata, README,
documentation home, navigation, exact diffuse method guides, roadmap, project
status, Step 25 handoff, and remaining-work inventory:

- 214 tests passed in the coverage job;
- total branch coverage was 87.25%, above the required 80%;
- `src/pystarmax/exact_diffuse_simulation_smoothing.py` coverage was 86.2%;
- `src/pystarmax/exact_diffuse_smoothing.py` coverage was 91.6%;
- `src/pystarmax/exact_diffuse_disturbance_smoothing.py` coverage was 88.1%;
- `src/pystarmax/exact_diffuse_forecasting.py` coverage was 87.8%;
- `src/pystarmax/exact_diffuse_inference.py` coverage was 88.8%;
- Black, isort, Ruff, and mypy passed;
- independent diagnostic-reference regeneration produced a clean diff;
- strict MkDocs passed;
- source distribution, wheel, and Twine checks passed;
- Ubuntu, Windows, and macOS passed on Python 3.11, 3.12, 3.13, and 3.14.

A validation-record-only merge-gate CI is required after this status and the
Step 25 handoff are updated. No implementation, test, API, example, README, or
method-guide changes are made after CI #536.
"""

          if "## Authoritative validation for 0.0.25" not in text:
              marker = "## Core validation for 0.0.23"
              if marker not in text:
                  raise RuntimeError("PROJECT_STATUS validation insertion marker missing")
              text = text.replace(marker, completed.rstrip() + "\n\n" + marker, 1)

          text, count = re.subn(
              r"## Immediate next tasks\n\n.*?\n\n## Known limitations",
              "## Immediate next tasks\n\n"
              "1. Run the validation-record-only merge-gate CI for PR #25.\n"
              "2. Confirm no temporary workflow, generated artifact, review thread, or\n"
              "   unresolved comment remains.\n"
              "3. Mark PR #25 ready and squash-merge it into `main`.\n"
              "4. Begin seasonal exact diffuse state augmentation and original-level\n"
              "   likelihood as the next independent stage.\n"
              "5. Research the diffuse `L2` lag-one autocovariance recursion separately.\n"
              "6. Add robust/parameter-aware inference and sparse execution in later stages.\n\n"
              "## Known limitations",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError("PROJECT_STATUS immediate-task block was not replaced")

          text = text.replace(
              "smoothing are implemented, but lag-one state autocovariance, cross-time\n  disturbance covariance, and simulation smoothing are not;",
              "smoothing and dense conditional simulation smoothing are implemented, but\n  lag-one state autocovariance and cross-time disturbance covariance are not;",
              1,
          )
          text = text.replace(
              "- forecast intervals are not exposed from `ExactDiffuseKalmanSTARIMA`;",
              "- exact diffuse forecast intervals require zero final diffuse rank and\n  condition on fitted parameters;",
              1,
          )
          if "- the exact diffuse simulation smoother is dense and intended for moderate" not in text:
              limitation_marker = "- state and covariance matrices are dense;"
              if limitation_marker not in text:
                  raise RuntimeError("PROJECT_STATUS density limitation marker missing")
              text = text.replace(
                  limitation_marker,
                  "- the exact diffuse simulation smoother is dense and intended for moderate\n"
                  "  samples; source-coordinate matrices can grow rapidly with time and state\n"
                  "  dimension;\n"
                  + limitation_marker,
                  1,
              )

          if "`docs/exact_diffuse_simulation_smoothing.md`," not in text:
              handoff = "`docs/exact_diffuse_inference.md`,\n"
              if handoff not in text:
                  raise RuntimeError("PROJECT_STATUS handoff marker missing")
              text = text.replace(
                  handoff,
                  "`docs/exact_diffuse_simulation_smoothing.md`,\n"
                  "`docs/exact_diffuse_forecast_intervals.md`,\n"
                  + handoff,
                  1,
              )

          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit record and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/record-step25-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATUS.md
          git commit -m "Record Step 25 authoritative validation"
          git push origin HEAD:agent/exact-diffuse-simulation-smoothing
