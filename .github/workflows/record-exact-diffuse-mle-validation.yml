name: Record exact diffuse MLE validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  record:
    if: github.event.pull_request.head.ref == 'agent/exact-diffuse-mle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exact-diffuse-mle
      - name: Update validation records
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          status_path = Path("PROJECT_STATUS.md")
          status = status_path.read_text()
          start = status.index("## Core validation for 0.0.20")
          end = status.index("## Design principles")
          validation = '''## Authoritative validation for 0.0.20

          GitHub Actions CI #440, run ID `30884139939`, validated the complete
          implementation, tests, example, metadata, README, documentation home,
          navigation, exact-diffuse guides, conditional-integrated guide, roadmap,
          project status, and Step 20 documentation head:

          - 176 tests passed in the coverage job;
          - total branch coverage was 86.99%, above the required 80%;
          - `src/pystarmax/exact_diffuse_mle.py` coverage was 84.3%;
          - `src/pystarmax/exact_diffuse.py` coverage was 87.8%;
          - `src/pystarmax/exact_integrated.py` coverage was 86.9%;
          - Black, isort, Ruff, and mypy passed;
          - independent diagnostic-reference regeneration produced a clean diff;
          - strict MkDocs passed;
          - source distribution, wheel, and Twine checks passed;
          - Ubuntu, Windows, and macOS passed on Python 3.11, 3.12, 3.13, and 3.14.

          A validation-record-only merge-gate CI is required after this status and the
          Step 20 handoff are updated. No implementation, test, API, example, README, or
          method-guide changes are made after CI #440.

          '''
          status = status[:start] + validation + status[end:]
          old_tasks = '''## Immediate next tasks

          1. Run complete CI on the synchronized documentation head.
          2. Record the authoritative final run identifier, test count, and coverage.
          3. Update PR #20, mark it ready, and squash-merge it into `main`.
          4. Add exact diffuse fixed-interval smoothing and disturbance smoothing.
          5. Add exact diffuse observed-information and natural covariance inference.
          6. Add ordinary-seasonal diffuse state augmentation.
          7. Add forecast intervals for the exact diffuse estimator.
          8. Add sparse state matrices, parameter-aware forecast paths, cross-time
             innovation covariance, simulation smoothing, order selection, exogenous
             inputs, GIS adapters, and cross-language fixtures.
          '''
          new_tasks = '''## Immediate next tasks

          1. Run the validation-record-only merge-gate CI.
          2. Update PR #20, mark it ready, and squash-merge it into `main`.
          3. Add exact diffuse fixed-interval smoothing and disturbance smoothing.
          4. Add exact diffuse observed-information and natural covariance inference.
          5. Add ordinary-seasonal diffuse state augmentation.
          6. Add forecast intervals for the exact diffuse estimator.
          7. Add sparse state matrices, parameter-aware forecast paths, cross-time
             innovation covariance, simulation smoothing, order selection, exogenous
             inputs, GIS adapters, and cross-language fixtures.
          '''
          if old_tasks not in status:
              raise SystemExit("PROJECT_STATUS immediate tasks block not found")
          status_path.write_text(status.replace(old_tasks, new_tasks, 1))

          step_path = Path("docs/development/STEP_20_EXACT_DIFFUSE_MLE.md")
          step = step_path.read_text()
          old_position = '''- core validation: GitHub Actions CI #433, run ID `30883369794`;
          - core result: 176 tests passed and 86.99% total branch coverage;
          - `src/pystarmax/exact_diffuse_mle.py` coverage: 84.3%;
          - quality, mypy, strict MkDocs, distributions, coverage, Ubuntu, and macOS were
            green when the core result was recorded;
          - a complete final documentation-head CI is required before merge.
          '''
          new_position = '''- authoritative implementation/documentation validation: GitHub Actions CI
            #440, run ID `30884139939`;
          - validation result: 176 tests passed and 86.99% total branch coverage;
          - `src/pystarmax/exact_diffuse_mle.py` coverage: 84.3%;
          - Black, isort, Ruff, mypy, strict MkDocs, distributions, and Ubuntu/Windows/
            macOS Python 3.11–3.14 all passed;
          - a validation-record-only merge-gate CI is required before merge.
          '''
          if old_position not in step:
              raise SystemExit("Step 20 repository position block not found")
          step = step.replace(old_position, new_position, 1)
          old_ci = '''Core CI #433 reported:

          - 176 tests passed in 42.17 seconds in the coverage job;
          - total branch coverage: 86.99%;
          - exact diffuse MLE module coverage: 84.3%;
          - Black, isort, Ruff, mypy, strict MkDocs, distribution checks, and diagnostic
            fixture regeneration passed;
          - final cross-platform completion is confirmed by the documentation-head CI.
          '''
          new_ci = '''Authoritative CI #440 reported:

          - 176 tests passed in 72.39 seconds in the coverage job;
          - total branch coverage: 86.99%;
          - exact diffuse MLE module coverage: 84.3%;
          - exact diffuse filter coverage: 87.8%;
          - exact integrated constructor coverage: 86.9%;
          - Black, isort, Ruff, mypy, strict MkDocs, distributions, and diagnostic fixture
            regeneration passed;
          - Ubuntu, Windows, and macOS passed on Python 3.11, 3.12, 3.13, and 3.14.

          The validation-record-only head changes only this handoff and
          `PROJECT_STATUS.md`. It receives one final merge-gate CI before PR #20 is
          marked ready and merged.
          '''
          if old_ci not in step:
              raise SystemExit("Step 20 validation block not found")
          step_path.write_text(step.replace(old_ci, new_ci, 1))
          PY
      - name: Commit records and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/record-exact-diffuse-mle-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATUS.md docs/development/STEP_20_EXACT_DIFFUSE_MLE.md
          git commit -m "Record final exact diffuse MLE validation"
          git push
