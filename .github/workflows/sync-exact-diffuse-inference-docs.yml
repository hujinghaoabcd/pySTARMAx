name: Synchronize exact diffuse inference docs

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.ref == 'agent/exact-diffuse-inference'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exact-diffuse-inference
      - name: Update documentation surfaces
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, label: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"{label} not found in {path}")
              file.write_text(text.replace(old, new, 1))

          replace(
              "README.md",
              '''> **Status — 0.0.22:** stationary, conditional ordinary-integrated,
          > exact-diffuse ordinary-integrated, and multiplicative seasonal Gaussian
          > Kalman STARMA/STARIMA estimation; expanded AR stationarity and positive-sign
          > MA invertibility diagnostics; observed-information Hessian and natural
          > covariance inference; missing-data filtering; ordinary RTS and exact diffuse
          > fixed-interval state smoothing; ordinary and exact diffuse primitive
          > innovation/state-disturbance smoothing; fixed-parameter Gaussian forecast
          > intervals; and optimizer-facing exact diffuse ordinary STARIMA likelihood.
          > Exact diffuse lag-one autocovariance, inference, simulation smoothing,
          > seasonal diffuse augmentation, sparse computation, exogenous regressors, and
          > time-varying extensions remain planned.
          ''',
              '''> **Status — 0.0.23:** stationary, conditional ordinary-integrated,
          > exact-diffuse ordinary-integrated, and multiplicative seasonal Gaussian
          > Kalman STARMA/STARIMA estimation; expanded AR stationarity and positive-sign
          > MA invertibility diagnostics; observed-information Hessian and natural
          > covariance inference for stationary, conditional integrated, seasonal, and
          > original-level exact diffuse likelihoods; missing-data filtering; ordinary
          > RTS and exact diffuse fixed-interval state smoothing; ordinary and exact
          > diffuse primitive innovation/state-disturbance smoothing; fixed-parameter
          > Gaussian forecast intervals; and optimizer-facing exact diffuse ordinary
          > STARIMA likelihood. Exact diffuse lag-one autocovariance, simulation
          > smoothing, seasonal diffuse augmentation, sparse computation, exogenous
          > regressors, and time-varying extensions remain planned.
          ''',
              "README status",
          )
          replace(
              "README.md",
              '''exact_disturbances = exact_mle.smooth_innovation_disturbances()
          print(exact_smoothed.smoothed_observations)
          print(exact_smoothed.smoothed_covariance)
          print(exact_disturbances.innovation_mean)
          print(exact_disturbances.innovation_covariance)
          ```
          ''',
              '''exact_disturbances = exact_mle.smooth_innovation_disturbances()
          exact_inference = exact_mle.likelihood_inference()
          exact_natural = exact_inference.innovation_covariance_inference()
          print(exact_smoothed.smoothed_observations)
          print(exact_smoothed.smoothed_covariance)
          print(exact_disturbances.innovation_mean)
          print(exact_disturbances.innovation_covariance)
          print(exact_inference.optimizer_table)
          print(exact_natural.table)
          ```
          ''',
              "README exact inference example",
          )
          replace(
              "README.md",
              '''[`docs/exact_diffuse_mle.md`](docs/exact_diffuse_mle.md),
          [`docs/exact_diffuse_smoothing.md`](docs/exact_diffuse_smoothing.md), and
          [`docs/exact_diffuse_disturbance_smoothing.md`](docs/exact_diffuse_disturbance_smoothing.md).
          ''',
              '''[`docs/exact_diffuse_mle.md`](docs/exact_diffuse_mle.md),
          [`docs/exact_diffuse_inference.md`](docs/exact_diffuse_inference.md),
          [`docs/exact_diffuse_smoothing.md`](docs/exact_diffuse_smoothing.md), and
          [`docs/exact_diffuse_disturbance_smoothing.md`](docs/exact_diffuse_disturbance_smoothing.md).
          ''',
              "README exact inference guide link",
          )
          replace(
              "README.md",
              '''`KalmanSTARIMA.infer()` applies the same procedure to the conditional
          differenced likelihood.
          
          See [`docs/likelihood_inference.md`](docs/likelihood_inference.md).
          ''',
              '''`KalmanSTARIMA.infer()` applies the same procedure to the conditional
          differenced likelihood. `ExactDiffuseKalmanSTARIMA.likelihood_inference()`
          instead rebuilds the transformed state, integrated original-level state, and
          exact diffuse filter at every curvature candidate. Its Hessian therefore
          belongs to the original-level exact diffuse likelihood rather than the
          conditional differenced objective.
          
          See [`docs/likelihood_inference.md`](docs/likelihood_inference.md) and
          [`docs/exact_diffuse_inference.md`](docs/exact_diffuse_inference.md).
          ''',
              "README observed information exact route",
          )
          replace(
              "README.md",
              '''- exact diffuse observed-information inference is unavailable;
          - seasonal diffuse augmentation and smoothing are unavailable;
          ''',
              '''- exact diffuse observed-information and natural innovation covariance
            inference are available, but analytic derivatives, robust covariance, and
            parameter-uncertainty propagation into forecasts or smoothers are not;
          - seasonal diffuse augmentation, smoothing, and inference are unavailable;
          ''',
              "README limitations",
          )

          replace(
              "docs/index.md",
              '''invertibility diagnostics, observed-likelihood Hessian inference, natural-scale
          innovation covariance inference, missing-observation filtering, fixed-interval
          ''',
              '''invertibility diagnostics, observed-likelihood Hessian and natural-scale
          innovation covariance inference for stationary, conditional integrated,
          seasonal, and original-level exact diffuse likelihoods, missing-observation
          filtering, fixed-interval
          ''',
              "docs index intro inference",
          )
          replace(
              "docs/index.md",
              '''exact_disturbances = exact_integrated_mle.smooth_innovation_disturbances()
          print(exact_smoothed.smoothed_observations)
          print(exact_disturbances.innovation_mean)
          ''',
              '''exact_disturbances = exact_integrated_mle.smooth_innovation_disturbances()
          exact_inference = exact_integrated_mle.likelihood_inference()
          exact_natural = exact_inference.innovation_covariance_inference()
          print(exact_smoothed.smoothed_observations)
          print(exact_disturbances.innovation_mean)
          print(exact_inference.optimizer_table)
          print(exact_natural.table)
          ''',
              "docs index exact inference example",
          )
          replace(
              "docs/index.md",
              '''[Exact diffuse disturbance smoothing](exact_diffuse_disturbance_smoothing.md)
          documents primitive innovation and state-equation disturbance posteriors from
          `Q R.T r_t` and `Q - Q R.T N_t R Q`, without fabricating diffuse lag-one
          autocovariance. The conditional `KalmanSTARIMA` likelihood remains a separate
          API.
          ''',
              '''[Exact diffuse disturbance smoothing](exact_diffuse_disturbance_smoothing.md)
          documents primitive innovation and state-equation disturbance posteriors from
          `Q R.T r_t` and `Q - Q R.T N_t R Q`, without fabricating diffuse lag-one
          autocovariance. [Exact diffuse likelihood inference](exact_diffuse_inference.md)
          documents original-level finite-difference curvature, strict singular-Hessian
          handling, and natural covariance delta inference. The conditional
          `KalmanSTARIMA` likelihood remains a separate API.
          ''',
              "docs index exact inference paragraph",
          )

          replace(
              "docs/exact_diffuse_mle.md",
              '''selection-nullspace uncertainty and does not require unavailable diffuse
          lag-one state autocovariance. See
          [Exact diffuse disturbance smoothing](exact_diffuse_disturbance_smoothing.md).
          
          ## Missing observations
          ''',
              '''selection-nullspace uncertainty and does not require unavailable diffuse
          lag-one state autocovariance. See
          [Exact diffuse disturbance smoothing](exact_diffuse_disturbance_smoothing.md).
          
          ## Observed-information and natural covariance inference
          
          Version 0.0.23 adds:
          
          ```python
          inference = model.likelihood_inference(
              relative_step=1e-4,
              absolute_step=1e-6,
              rcond=1e-10,
          )
          natural = inference.innovation_covariance_inference()
          ```
          
          Every finite-difference candidate rebuilds the transformed STARMA state,
          integrated original-level state, and exact diffuse filter. The Hessian is
          therefore curvature of the original-level exact diffuse objective rather than
          the conditional differenced likelihood. A non-positive-definite or
          rank-deficient Hessian raises by default; `allow_singular=True` explicitly
          enables a labelled positive-eigenspace diagnostic generalized inverse.
          Scalar, diagonal, and full-Cholesky innovation covariance coordinates use the
          existing analytic natural-covariance Jacobian. See
          [Exact diffuse likelihood inference](exact_diffuse_inference.md).
          
          ## Missing observations
          ''',
              "exact MLE inference section",
          )
          replace(
              "docs/exact_diffuse_mle.md",
              '''- exact diffuse observed-information inference is not yet implemented;
          - exact diffuse marginal state and primitive innovation/state-disturbance
          ''',
              '''- exact diffuse observed-information and natural innovation covariance
            inference are implemented, but analytic derivatives, robust covariance, and
            parameter uncertainty propagated into forecasts or smoothers are not;
          - exact diffuse marginal state and primitive innovation/state-disturbance
          ''',
              "exact MLE inference limitation",
          )

          replace(
              "docs/exact_diffuse.md",
              '''`exact_diffuse_disturbance_smoother()` and the fitted estimator facade. See
          [Exact diffuse STARIMA maximum likelihood](exact_diffuse_mle.md),
          [Exact diffuse smoothing](exact_diffuse_smoothing.md), and
          [Exact diffuse disturbance smoothing](exact_diffuse_disturbance_smoothing.md).
          The conditional `KalmanSTARIMA` estimator remains unchanged.
          ''',
              '''`exact_diffuse_disturbance_smoother()` and the fitted estimator facade.
          Version 0.0.23 adds observed-information and natural innovation covariance
          inference by rebuilding the complete original-level exact diffuse objective at
          every curvature candidate. See
          [Exact diffuse STARIMA maximum likelihood](exact_diffuse_mle.md),
          [Exact diffuse likelihood inference](exact_diffuse_inference.md),
          [Exact diffuse smoothing](exact_diffuse_smoothing.md), and
          [Exact diffuse disturbance smoothing](exact_diffuse_disturbance_smoothing.md).
          The conditional `KalmanSTARIMA` estimator remains unchanged.
          ''',
              "exact diffuse inference cross reference",
          )
          replace(
              "docs/exact_diffuse.md",
              '''- exact diffuse observed-information inference is not yet implemented;
          - exact diffuse marginal state and primitive innovation/state-disturbance
          ''',
              '''- exact diffuse observed-information and natural innovation covariance
            inference are implemented, but analytic derivatives, robust covariance, and
            parameter-uncertainty propagation are not;
          - exact diffuse marginal state and primitive innovation/state-disturbance
          ''',
              "exact diffuse inference limitation",
          )

          roadmap_path = Path("docs/roadmap.md")
          roadmap = roadmap_path.read_text()
          marker = "## Next priorities\n"
          if marker not in roadmap:
              raise SystemExit("roadmap marker not found")
          section = '''## Implemented in 0.0.23: exact diffuse likelihood inference
          
          - observed-information curvature of the original-level exact diffuse objective;
          - transformed STARMA, integrated state, covariance, and exact diffuse filter
            reconstruction at every finite-difference candidate;
          - shared AR stationarity and positive-sign inverse-MA feasibility boundaries;
          - immutable Hessian, covariance, standard errors, Wald summaries, correlations,
            rank, eigenvalues, score, steps, and condition diagnostics;
          - strict full-rank positive-definite Hessian policy by default;
          - explicitly labelled positive-eigenspace generalized inverse diagnostics;
          - scalar, diagonal, and full-Cholesky natural innovation covariance delta
            inference with dynamic/covariance cross uncertainty;
          - scalar random-walk closed-form Hessian, optimizer covariance, and natural
            variance standard-error references;
          - missing-data-aware candidate reconstruction;
          - fitted `ExactDiffuseKalmanSTARIMA.likelihood_inference()` and low-level
            `infer_exact_diffuse_kalman_starima()`;
          - method guide, analytic example, navigation, README, status, and Step 23
            handoff.
          
          ## Next priorities
          '''
          roadmap = roadmap.replace(marker, section, 1)
          old_priorities = '''1. Exact diffuse observed-information and natural covariance inference.
          2. Exact diffuse simulation smoothing.
          3. Seasonal ordinary-seasonal diffuse state augmentation and smoothing.
          4. Forecast intervals for the exact diffuse estimator.
          5. Research the nontrivial diffuse `L2` recursion required for lag-one state
             autocovariance and cross-time disturbance covariance.
          6. Parameter-aware paths, sparse state matrices, and cross-time innovation
             covariance.
          7. Smooth admissibility parameterization and automatic order selection.
          8. Exogenous regressors, GIS adapters, cross-language fixtures, PyPI release,
             parallel execution, robust inference, and time-varying extensions.
          '''
          new_priorities = '''1. Forecast intervals for the exact diffuse estimator.
          2. Exact diffuse simulation smoothing.
          3. Seasonal ordinary-seasonal diffuse state augmentation, smoothing, and
             inference.
          4. Research the nontrivial diffuse `L2` recursion required for lag-one state
             autocovariance and cross-time disturbance covariance.
          5. Robust, profile-likelihood, and parameter-uncertainty propagation for exact
             diffuse inference.
          6. Parameter-aware paths, sparse state matrices, and cross-time innovation
             covariance.
          7. Smooth admissibility parameterization and automatic order selection.
          8. Exogenous regressors, GIS adapters, cross-language fixtures, PyPI release,
             parallel execution, robust inference, and time-varying extensions.
          '''
          if old_priorities not in roadmap:
              raise SystemExit("roadmap priorities not found")
          roadmap_path.write_text(roadmap.replace(old_priorities, new_priorities, 1))

          status_path = Path("PROJECT_STATUS.md")
          status = status_path.read_text()
          old_state = '''- PR #1 through PR #21 have been squash-merged into `main`.
          - `main` is version `0.0.21` at merge commit
            `b6e9b167a012191590aae2abef0218f25482d00b`.
          - Current branch: `agent/exact-diffuse-disturbance-smoothing`.
          - Current draft pull request: PR #22, `Add exact diffuse disturbance smoothing`.
          - Current development version: `0.0.22`.
          - The branch adds exact diffuse primitive innovation and state-equation
            disturbance marginal posterior moments from backward information quantities.
          - Lag-one state autocovariance, cross-time disturbance covariance, and
            simulation smoothing remain explicitly outside this stage.
          '''
          new_state = '''- PR #1 through PR #22 have been squash-merged into `main`.
          - `main` is version `0.0.22` at merge commit
            `6a9f4cf9d9e19edd54123b22a892f36b7daf7b66`.
          - Current branch: `agent/exact-diffuse-inference`.
          - Current draft pull request: PR #23, `Add exact diffuse likelihood inference`.
          - Current development version: `0.0.23`.
          - The branch adds observed-information and natural innovation covariance
            inference for the original-level exact diffuse STARIMA likelihood.
          - Analytic derivatives, robust covariance, parameter-uncertainty propagation,
            and seasonal exact diffuse inference remain explicitly outside this stage.
          '''
          if old_state not in status:
              raise SystemExit("status repository state not found")
          status = status.replace(old_state, new_state, 1)
          marker = "## Authoritative validation for 0.0.22\n"
          if marker not in status:
              raise SystemExit("status validation marker not found")
          section = '''## Completed in 0.0.23
          
          ### Original-level exact diffuse observed information
          
          - rebuilds optimizer coordinates, transformed STARMA state, integrated
            original-level state, and exact diffuse filter at every curvature candidate;
          - computes central finite-difference gradient and Hessian of the negative exact
            diffuse likelihood;
          - applies the fitted AR stationarity and positive-sign inverse-MA feasibility
            boundaries;
          - returns immutable optimizer-coordinate covariance, standard errors, Wald
            summaries, correlations, eigenvalues, rank, condition number, steps, score,
            and objective diagnostics;
          - rejects non-positive-definite or rank-deficient Hessians by default;
          - supports an explicitly labelled positive-eigenspace generalized inverse only
            when `allow_singular=True`;
          - reuses the analytic scalar, diagonal, and full-Cholesky natural covariance
            Jacobian with dynamic/covariance cross uncertainty;
          - integrates as `ExactDiffuseKalmanSTARIMA.likelihood_inference()` and
            `infer_exact_diffuse_kalman_starima()`.
          
          ### Validation scope
          
          Tests cover a scalar random-walk closed-form Hessian, raw optimizer covariance,
          natural variance delta standard error, fitted-objective identity, missing data,
          immutable arrays, strict singular-Hessian rejection, explicit generalized
          inverse diagnostics, and fit/step/`rcond` validation.
          
          ### Deliberate boundary
          
          Version 0.0.23 uses numerical observed information. Analytic derivative
          recursions, robust covariance, profile likelihood, parameter uncertainty in
          forecasts or smoothers, and seasonal exact diffuse inference remain future
          stages.
          
          ## Core validation for 0.0.23
          
          GitHub Actions CI #497, run ID `30895807519`, validated the numerical core,
          public exports, model facade, packaging, and full cross-platform matrix:
          
          - 197 tests passed in the coverage job;
          - total branch coverage was 87.27%, above the required 80%;
          - `src/pystarmax/exact_diffuse_inference.py` coverage was 88.8%;
          - `src/pystarmax/exact_diffuse_disturbance_smoothing.py` coverage was 88.1%;
          - `src/pystarmax/exact_diffuse_smoothing.py` coverage was 91.6%;
          - `src/pystarmax/exact_diffuse_mle.py` coverage was 84.3%;
          - `src/pystarmax/exact_diffuse.py` coverage was 87.8%;
          - `src/pystarmax/exact_integrated.py` coverage was 86.9%;
          - Black, isort, Ruff, and mypy passed;
          - independent diagnostic-reference regeneration produced a clean diff;
          - strict MkDocs passed;
          - source distribution, wheel, and Twine checks passed;
          - Ubuntu, Windows, and macOS passed on Python 3.11, 3.12, 3.13, and 3.14.
          
          A complete final CI is required on the synchronized documentation head. The
          authoritative final run must be recorded before merge.
          
          '''
          status = status.replace(marker, section + marker, 1)
          old_tasks = '''## Immediate next tasks
          
          1. Run the validation-record-only merge-gate CI.
          2. Update PR #22, mark it ready, and squash-merge it into `main`.
          3. Add exact diffuse observed-information and natural covariance inference.
          4. Add exact diffuse simulation smoothing and seasonal diffuse augmentation.
          5. Research the nontrivial diffuse `L2` autocovariance recursion separately.
          6. Add forecast intervals, sparse state matrices, parameter-aware paths,
             cross-time innovation covariance, order selection, exogenous inputs, GIS
             adapters, and cross-language fixtures.
          '''
          new_tasks = '''## Immediate next tasks
          
          1. Run complete CI on the synchronized 0.0.23 documentation head.
          2. Record the authoritative final run identifier, test count, and coverage.
          3. Update PR #23, mark it ready, and squash-merge it into `main`.
          4. Add forecast intervals for the exact diffuse estimator.
          5. Add exact diffuse simulation smoothing and seasonal diffuse augmentation.
          6. Research the nontrivial diffuse `L2` autocovariance recursion separately.
          7. Add robust inference, parameter-aware paths, sparse state matrices,
             cross-time innovation covariance, order selection, exogenous inputs, GIS
             adapters, and cross-language fixtures.
          '''
          if old_tasks not in status:
              raise SystemExit("status tasks not found")
          status = status.replace(old_tasks, new_tasks, 1)
          old_limit = '''- exact diffuse observed-information and natural covariance inference are not
            implemented;
          - exact diffuse marginal state and primitive innovation/state-disturbance
          '''
          new_limit = '''- exact diffuse observed-information and natural innovation covariance inference
            are implemented, but analytic derivatives, robust covariance, profile
            likelihood, and parameter-uncertainty propagation are not;
          - exact diffuse marginal state and primitive innovation/state-disturbance
          '''
          if old_limit not in status:
              raise SystemExit("status inference limitation not found")
          status = status.replace(old_limit, new_limit, 1)
          status = status.replace(
              '`docs/exact_diffuse_disturbance_smoothing.md`,\n',
              '`docs/exact_diffuse_inference.md`,\n`docs/exact_diffuse_disturbance_smoothing.md`,\n',
              1,
          )
          status_path.write_text(status)

          Path(".github/workflows/sync-exact-diffuse-inference-docs.yml").unlink()
          PY
      - name: Commit synchronized documentation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Synchronize exact diffuse inference documentation"
          git push origin HEAD:agent/exact-diffuse-inference
