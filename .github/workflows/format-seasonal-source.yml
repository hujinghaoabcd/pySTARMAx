name: Format seasonal source snapshot

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m black src tests tools examples
      - run: python -m isort src tests tools examples
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-seasonal-source
          path: |
            src
            tests
            examples
          retention-days: 1
