name: Apply seasonal formatting

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seasonal-starima
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m black src tests tools examples
      - run: python -m isort src tests tools examples
      - name: Commit exact formatter output
        shell: bash
        run: |
          rm .github/workflows/format-seasonal-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format seasonal STARIMA implementation"
          git push origin HEAD:agent/seasonal-starima
