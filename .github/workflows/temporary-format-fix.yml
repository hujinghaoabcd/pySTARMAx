name: Temporary format fix

on:
  push:
    branches:
      - agent/kalman-state-smoothing

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kalman-state-smoothing
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install black==26.5.1
      - name: Fix inherited inference regression
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pystarmax/likelihood_inference.py')
          text = path.read_text(encoding='utf-8')
          old = '        n_locations=observations.shape[1],\n'
          new = '        n_locations=model.result_.innovation_covariance.shape[0],\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one inference location expression, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Apply repository formatter
        run: |
          python -m black \
            src/pystarmax/covariance_inference.py \
            src/pystarmax/likelihood_inference.py \
            src/pystarmax/smoothing.py \
            tests/test_covariance_inference.py \
            tests/test_state_smoothing.py
      - name: Commit deterministic fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pystarmax/covariance_inference.py \
                  src/pystarmax/likelihood_inference.py \
                  src/pystarmax/smoothing.py \
                  tests/test_covariance_inference.py \
                  tests/test_state_smoothing.py
          git diff --cached --quiet && exit 0
          git commit -m 'Fix inference location metadata and format smoothing code'
          git push origin HEAD:agent/kalman-state-smoothing
