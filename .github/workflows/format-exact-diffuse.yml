name: Format exact diffuse

on:
  push:
    branches:
      - agent/exact-diffuse-kalman

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exact-diffuse-kalman
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install black==26.5.1 isort==8.0.1
      - run: python -m black src/pystarmax/exact_diffuse.py tests/test_exact_diffuse.py
      - run: python -m isort src/pystarmax/exact_diffuse.py tests/test_exact_diffuse.py src/pystarmax/__init__.py
      - name: Commit formatting and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/format-exact-diffuse.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pystarmax/exact_diffuse.py tests/test_exact_diffuse.py src/pystarmax/__init__.py
          git commit -m "Format exact diffuse filtering"
          git push
