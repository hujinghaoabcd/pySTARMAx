name: Format seasonal Kalman

on:
  push:
    branches:
      - agent/seasonal-kalman-starima

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seasonal-kalman-starima
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install black==26.5.1
      - run: python -m black src/pystarmax/seasonal_maximum_likelihood.py tests/test_seasonal_maximum_likelihood.py
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pystarmax/seasonal_maximum_likelihood.py tests/test_seasonal_maximum_likelihood.py
          git commit -m "Format seasonal Kalman STARIMA"
          git push
