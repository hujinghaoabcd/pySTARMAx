name: Format seasonal exact diffuse foundation

on:
  push:
    branches:
      - agent/seasonal-exact-diffuse-state-space

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seasonal-exact-diffuse-state-space
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Format new Python files
        run: |
          python -m pip install black==26.5.1
          python -m black \
            src/pystarmax/exact_seasonal_integrated.py \
            tests/test_exact_seasonal_integrated.py
      - name: Commit formatting and remove helper workflow
        run: |
          git rm .github/workflows/format-seasonal-exact.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pystarmax/exact_seasonal_integrated.py tests/test_exact_seasonal_integrated.py
          git commit -m "Format seasonal exact diffuse foundation"
          git push origin HEAD:agent/seasonal-exact-diffuse-state-space
