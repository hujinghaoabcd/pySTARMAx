name: Temporary format

on:
  push:
    branches: [agent/state-space-kalman-core]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/state-space-kalman-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install black==26.5.1
      - run: python -m black src/pystarmax/state_space.py tests/test_state_space.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pystarmax/state_space.py tests/test_state_space.py
          git diff --cached --quiet || git commit -m "Format state-space implementation"
          git push origin HEAD:agent/state-space-kalman-core
