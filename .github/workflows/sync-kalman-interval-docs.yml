name: Synchronize Kalman interval docs

on:
  push:
    branches:
      - agent/kalman-original-scale-intervals

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kalman-original-scale-intervals
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Update README and method guides
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme_path = Path("README.md")
          readme = readme_path.read_text()
          old = '''> **Status — 0.0.17:** stationary, ordinary-integrated, and
          > multiplicative seasonal Gaussian Kalman STARMA/STARIMA estimation;
          > expanded AR stationarity and positive-sign MA invertibility diagnostics;
          > observed-information Hessian inference for stationary and seasonal factor
          > models; natural innovation covariance delta-method inference; missing-data
          > filtering; RTS state and original innovation smoothing; original-scale
          > reconstruction; conditional/bootstrap intervals; and rolling evaluation.
          > Exact diffuse integrated likelihood, original-scale Kalman intervals, sparse
          > computation, exogenous regressors, and time-varying extensions remain planned.
          '''
          new = '''> **Status — 0.0.18:** stationary, ordinary-integrated, and
          > multiplicative seasonal Gaussian Kalman STARMA/STARIMA estimation;
          > expanded AR stationarity and positive-sign MA invertibility diagnostics;
          > observed-information Hessian inference for stationary and seasonal factor
          > models; natural innovation covariance delta-method inference; missing-data
          > filtering; RTS state and original innovation smoothing; fixed-parameter
          > Gaussian forecast intervals with filtered-state and future-innovation
          > uncertainty; pathwise original-scale ordinary/seasonal reconstruction;
          > conditional/bootstrap intervals; and rolling evaluation. Exact diffuse
          > integrated likelihood, parameter-aware Kalman intervals, sparse computation,
          > exogenous regressors, and time-varying extensions remain planned.
          '''
          if old not in readme:
              raise SystemExit("README status block not found")
          readme = readme.replace(old, new, 1)

          old = '''print(fit.summary())
          print(mle.admissibility().summary())
          print(mle.predict(steps=6))
          '''
          new = '''print(fit.summary())
          print(mle.admissibility().summary())
          print(mle.predict(steps=6))
          stationary_interval = mle.predict_interval(
              steps=6,
              level=0.95,
              n_simulations=5000,
              random_state=42,
          )
          print(stationary_interval.lower, stationary_interval.upper)
          '''
          if old not in readme:
              raise SystemExit("README stationary example not found")
          readme = readme.replace(old, new, 1)

          old = '''print(integrated_result.summary())
          print(integrated_mle.predict_differenced(steps=6))
          print(integrated_mle.predict(steps=6))
          '''
          new = '''print(integrated_result.summary())
          print(integrated_mle.predict_differenced(steps=6))
          print(integrated_mle.predict(steps=6))
          transformed_interval = integrated_mle.predict_differenced_interval(
              steps=6,
              n_simulations=5000,
              random_state=42,
          )
          original_interval = integrated_mle.predict_interval(
              steps=6,
              n_simulations=5000,
              random_state=42,
          )
          print(transformed_interval.lower, transformed_interval.upper)
          print(original_interval.lower, original_interval.upper)
          '''
          if old not in readme:
              raise SystemExit("README integrated example not found")
          readme = readme.replace(old, new, 1)

          old = '''- `filter()`, `smooth()`, `smooth_innovation_disturbances()`, `infer()`,
            `to_state_space()`, and `predict_differenced()` use the highest difference
            scale;
          - `predict()` recursively restores the original scale from finite terminal
            differencing anchors;
          '''
          new = '''- `filter()`, `smooth()`, `smooth_innovation_disturbances()`, `infer()`,
            `to_state_space()`, `predict_differenced()`, and
            `predict_differenced_interval()` use the highest difference scale;
          - `predict()` recursively restores the original scale from finite terminal
            differencing anchors;
          - `predict_interval()` draws the final filtered state and future process
            innovations, inverse-differences every complete path, and only then takes
            original-scale quantiles;
          '''
          if old not in readme:
              raise SystemExit("README integrated scale block not found")
          readme = readme.replace(old, new, 1)

          readme = readme.replace("print(natural.element_table)", "print(natural.table)")
          readme = readme.replace(
              "print(seasonal_inference.innovation_covariance_inference().element_table)",
              "print(seasonal_inference.innovation_covariance_inference().table)",
          )

          old = '''print(seasonal_mle.predict_differenced(steps=24))
          print(seasonal_mle.predict(steps=24))
          print(seasonal_mle.smooth().smoothed_observations)
          '''
          new = '''print(seasonal_mle.predict_differenced(steps=24))
          print(seasonal_mle.predict(steps=24))
          seasonal_interval = seasonal_mle.predict_interval(
              steps=24,
              n_simulations=5000,
              random_state=42,
          )
          print(seasonal_interval.lower, seasonal_interval.upper)
          print(seasonal_mle.smooth().smoothed_observations)
          '''
          if old not in readme:
              raise SystemExit("README seasonal example not found")
          readme = readme.replace(old, new, 1)

          marker = '''## Forecast intervals and rolling evaluation
          
          Conditional future-innovation intervals:
          '''
          addition = '''## Gaussian Kalman forecast intervals
          
          Version 0.0.18 propagates the final filtered-state covariance and future
          process innovations under fixed fitted parameters:
          
          ```python
          kalman_interval = integrated_mle.predict_interval(
              steps=24,
              level=0.95,
              n_simulations=5000,
              random_state=42,
          )
          ```
          
          Ordinary and seasonal integrated models also expose
          `predict_differenced_interval()` on the transformed scale. Original-scale
          bounds are constructed by inverse-differencing every simulated path before
          quantiles; marginal transformed bounds are never inverse-transformed as if
          horizons were independent. See
          [`docs/kalman_forecast_intervals.md`](docs/kalman_forecast_intervals.md).
          
          ## Forecast intervals and rolling evaluation
          
          Conditional future-innovation intervals:
          '''
          if marker not in readme:
              raise SystemExit("README forecast heading not found")
          readme = readme.replace(marker, addition, 1)
          readme_path.write_text(readme)

          integrated_path = Path("docs/integrated_maximum_likelihood.md")
          integrated = integrated_path.read_text()
          old = '''stationary_forecast = model.predict_differenced(steps=12)
          stationary_fitted = model.fitted_differenced()
          '''
          new = '''stationary_forecast = model.predict_differenced(steps=12)
          stationary_interval = model.predict_differenced_interval(
              steps=12,
              level=0.95,
              n_simulations=5000,
              random_state=42,
          )
          stationary_fitted = model.fitted_differenced()
          '''
          if old not in integrated:
              raise SystemExit("integrated transformed example not found")
          integrated = integrated.replace(old, new, 1)
          old = '''level_forecast = model.predict(steps=12)
          level_fitted = model.fitted_original()
          '''
          new = '''level_forecast = model.predict(steps=12)
          level_interval = model.predict_interval(
              steps=12,
              level=0.95,
              n_simulations=5000,
              random_state=42,
          )
          level_fitted = model.fitted_original()
          '''
          if old not in integrated:
              raise SystemExit("integrated original example not found")
          integrated = integrated.replace(old, new, 1)
          old = '''Parameter uncertainty is not propagated through original-scale point forecasts
          or smoothing results. Original-scale forecast intervals for the Kalman STARIMA
          wrapper are not yet exposed.
          '''
          new = '''Version 0.0.18 adds fixed-parameter Gaussian intervals. Every path starts
          from the final filtered state posterior, receives future innovations from the
          fitted covariance, and is inverse-differenced independently before original-
          scale quantiles. This propagates filtered-state and process uncertainty but not
          parameter-estimation uncertainty. See
          [Gaussian Kalman forecast intervals](kalman_forecast_intervals.md).
          '''
          if old not in integrated:
              raise SystemExit("integrated old interval limitation not found")
          integrated = integrated.replace(old, new, 1)
          integrated = integrated.replace(
              "- original-scale forecast intervals are not yet implemented;\n",
              "- forecast intervals condition on fitted parameters and use Monte Carlo quantiles;\n",
          )
          integrated = integrated.replace(
              "- only ordinary integration is supported; seasonal integration remains in the\n  conditional `SeasonalSTARIMA` estimator;\n",
              "- this wrapper covers ordinary integration; multiplicative seasonal integration is provided by `SeasonalKalmanSTARIMA`;\n",
          )
          integrated_path.write_text(integrated)

          seasonal_path = Path("docs/seasonal_maximum_likelihood.md")
          seasonal = seasonal_path.read_text()
          old = '''If any required value is non-finite, transformed-scale estimation and forecasts
          remain available, but `predict()` raises instead of interpolating or carrying a
          value forward. `original_scale_forecast_available` records this state.
          '''
          new = '''If any required value is non-finite, transformed-scale estimation, point
          forecasts, and `predict_differenced_interval()` remain available, but
          `predict()` and `predict_interval()` raise instead of interpolating or carrying
          a value forward. `original_scale_forecast_available` records this state.
          '''
          if old not in seasonal:
              raise SystemExit("seasonal terminal history block not found")
          seasonal = seasonal.replace(old, new, 1)
          marker = '''## Result and parameter counting
          '''
          addition = '''## Gaussian forecast intervals
          
          ```python
          transformed_interval = model.predict_differenced_interval(
              steps=24,
              level=0.95,
              n_simulations=5000,
              random_state=42,
          )
          original_interval = model.predict_interval(
              steps=24,
              level=0.95,
              n_simulations=5000,
              random_state=42,
          )
          ```
          
          Future paths draw the final filtered state and future location-level
          innovations under fixed fitted parameters. Original-scale bounds reverse the
          combined differencing state for every complete simulated path, including
          rolling seasonal histories, before taking quantiles. See
          [Gaussian Kalman forecast intervals](kalman_forecast_intervals.md).
          
          ## Result and parameter counting
          '''
          if marker not in seasonal:
              raise SystemExit("seasonal result heading not found")
          seasonal = seasonal.replace(marker, addition, 1)
          seasonal = seasonal.replace(
              "- refusal of original-scale forecasts with incomplete terminal seasonal\n  history;\n",
              "- transformed interval availability and original interval refusal with incomplete terminal seasonal history;\n",
          )
          seasonal = seasonal.replace(
              "- original-scale forecast intervals are unavailable;\n",
              "- forecast intervals condition on fitted parameters and use Monte Carlo quantiles;\n",
          )
          seasonal_path.write_text(seasonal)
          PY
      - name: Commit synchronized docs and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/sync-kalman-interval-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/integrated_maximum_likelihood.md docs/seasonal_maximum_likelihood.md
          git commit -m "Document Kalman forecast interval APIs"
          git push
