name: Apply stage 7 quality fixes

on:
  push:
    branches: [agent/rolling-origin-interval-evaluation]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rolling-origin-interval-evaluation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install quality dependencies
        run: python -m pip install -e ".[dev,docs]"
      - name: Correct interval coverage expectation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_evaluation.py")
          text = path.read_text(encoding="utf-8")
          old = "np.testing.assert_array_equal(result.covered, observed <= 1.0)"
          new = "np.testing.assert_array_equal(\n        result.covered, (observed >= -1.0) & (observed <= 1.0)\n    )"
          if old not in text:
              raise SystemExit("expected assertion not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Apply formatters
        run: |
          python -m black src/pystarmax/evaluation.py tests/test_evaluation.py
          python -m isort src/pystarmax/evaluation.py tests/test_evaluation.py
      - name: Validate focused change
        run: |
          python -m ruff check src/pystarmax/evaluation.py tests/test_evaluation.py
          python -m mypy
          python -m pytest tests/test_evaluation.py -q
      - name: Remove temporary workflow
        run: rm .github/workflows/apply-stage7-quality.yml
      - name: Commit quality fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Polish rolling-origin evaluation core"
          git push origin HEAD:agent/rolling-origin-interval-evaluation
