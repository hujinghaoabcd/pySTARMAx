name: Temporary covariance type fix

on:
  push:
    branches:
      - agent/kalman-state-smoothing

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kalman-state-smoothing
          fetch-depth: 0
      - name: Add explicit covariance index type
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pystarmax/covariance_inference.py')
          text = path.read_text(encoding='utf-8')
          old = '    covariance = codec.unpack(raw)\n\n    if covariance_type == "scalar":\n'
          new = '    covariance = codec.unpack(raw)\n    indices: tuple[tuple[int, int], ...]\n\n    if covariance_type == "scalar":\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one transform block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit type fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pystarmax/covariance_inference.py
          git commit -m 'Fix covariance element index typing'
          git push origin HEAD:agent/kalman-state-smoothing
