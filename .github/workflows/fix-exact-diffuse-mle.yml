name: Fix exact diffuse MLE

on:
  push:
    branches:
      - agent/exact-diffuse-mle

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exact-diffuse-mle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install black==26.5.1 isort==8.0.1
      - name: Fix validation expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_exact_diffuse_mle.py")
          text = path.read_text()
          old = 'with pytest.raises(ValueError, match="smaller than"):'
          new = 'with pytest.raises(ValueError, match="at least three"):'
          if old not in text:
              raise SystemExit("validation expectation not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - run: python -m black src/pystarmax/exact_diffuse_mle.py tests/test_exact_diffuse_mle.py
      - run: python -m isort src/pystarmax/exact_diffuse_mle.py tests/test_exact_diffuse_mle.py src/pystarmax/__init__.py
      - name: Commit fixes and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-exact-diffuse-mle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pystarmax/exact_diffuse_mle.py tests/test_exact_diffuse_mle.py src/pystarmax/__init__.py
          git commit -m "Format and fix exact diffuse MLE tests"
          git push
