name: Format Kalman intervals

on:
  push:
    branches:
      - agent/kalman-original-scale-intervals

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kalman-original-scale-intervals
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install black==26.5.1 isort==8.0.1
      - name: Fix scalar test indexing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_kalman_forecast_intervals.py")
          text = path.read_text()
          text = text.replace(
              "float(original.upper[-1] - original.lower[-1])",
              "float((original.upper[-1] - original.lower[-1])[0])",
          )
          text = text.replace(
              "float(original.upper[0] - original.lower[0])",
              "float((original.upper[0] - original.lower[0])[0])",
          )
          path.write_text(text)
          PY
      - run: >-
          python -m black
          src/pystarmax/kalman_forecasting.py
          src/pystarmax/integrated_forecasting.py
          src/pystarmax/seasonal_forecasting.py
          src/pystarmax/maximum_likelihood.py
          tests/test_kalman_forecast_intervals.py
      - run: >-
          python -m isort
          src/pystarmax/kalman_forecasting.py
          src/pystarmax/integrated_forecasting.py
          src/pystarmax/seasonal_forecasting.py
          src/pystarmax/maximum_likelihood.py
          src/pystarmax/__init__.py
          tests/test_kalman_forecast_intervals.py
      - name: Commit formatting and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/format-kalman-intervals.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pystarmax tests/test_kalman_forecast_intervals.py
          git commit -m "Format and fix Kalman interval tests"
          git push
