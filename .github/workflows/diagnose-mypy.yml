name: Diagnose mypy

on:
  push:
    branches: [agent/initial-starma-core]

permissions:
  contents: write

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/initial-starma-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Capture mypy report
        shell: bash
        run: python -m mypy > MYPY_REPORT.txt 2>&1 || true
      - name: Commit diagnostic report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MYPY_REPORT.txt
          git commit -m "Capture mypy diagnostic report"
          git push origin HEAD:agent/initial-starma-core
