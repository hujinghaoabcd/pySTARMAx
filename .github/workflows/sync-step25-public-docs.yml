name: Sync Step 25 public documentation

on:
  push:
    branches:
      - agent/exact-diffuse-simulation-smoothing

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exact-diffuse-simulation-smoothing
          fetch-depth: 0
      - name: Synchronize public status and method boundaries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          readme = read("README.md")
          readme, count = re.subn(
              r"> \*\*Status — 0\.0\.23:\*\*.*?\n\n## Installation",
              "> **Status — 0.0.25:** stationary, conditional ordinary-integrated,\n"
              "> exact-diffuse ordinary-integrated, and multiplicative seasonal Gaussian\n"
              "> Kalman STARMA/STARIMA estimation; AR stationarity and positive-sign MA\n"
              "> invertibility diagnostics; observed-information and natural covariance\n"
              "> inference for stationary, conditional integrated, seasonal, and exact\n"
              "> diffuse likelihoods; missing-data filtering; ordinary RTS and exact diffuse\n"
              "> state smoothing; ordinary and exact diffuse primitive disturbance smoothing;\n"
              "> fixed-parameter forecast intervals including resolved exact diffuse terminal\n"
              "> posteriors; and exact diffuse conditional simulation of complete state and\n"
              "> observation paths. Diffuse lag-one autocovariance, seasonal exact diffuse\n"
              "> augmentation, scalable sparse execution, robust/parameter-aware inference,\n"
              "> exogenous regressors, and time-varying extensions remain planned.\n\n"
              "## Installation",
              readme,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError("README status block was not replaced")

          anchor = "exact_natural = exact_inference.innovation_covariance_inference()\n"
          if "exact_paths = exact_mle.simulate_smoothing_paths(" not in readme:
              if anchor not in readme:
                  raise RuntimeError("README exact inference anchor missing")
              readme = readme.replace(
                  anchor,
                  anchor
                  + "exact_interval = exact_mle.predict_interval(\n"
                  + "    steps=6, n_simulations=5000, random_state=42\n"
                  + ")\n"
                  + "exact_paths = exact_mle.simulate_smoothing_paths(\n"
                  + "    n_simulations=2000, random_state=42\n"
                  + ")\n",
                  1,
              )
          output_anchor = "print(exact_natural.table)\n"
          if "print(exact_paths.maximum_mean_discrepancy)" not in readme:
              if output_anchor not in readme:
                  raise RuntimeError("README output anchor missing")
              readme = readme.replace(
                  output_anchor,
                  output_anchor
                  + "print(exact_interval.lower, exact_interval.upper)\n"
                  + "print(exact_paths.state_paths.shape)\n"
                  + "print(exact_paths.maximum_mean_discrepancy)\n",
                  1,
              )
          link_anchor = "[`docs/exact_diffuse_disturbance_smoothing.md`](docs/exact_diffuse_disturbance_smoothing.md)."
          if "docs/exact_diffuse_simulation_smoothing.md" not in readme:
              if link_anchor not in readme:
                  raise RuntimeError("README exact docs anchor missing")
              readme = readme.replace(
                  link_anchor,
                  "[`docs/exact_diffuse_disturbance_smoothing.md`](docs/exact_diffuse_disturbance_smoothing.md),\n"
                  "[`docs/exact_diffuse_forecast_intervals.md`](docs/exact_diffuse_forecast_intervals.md), and\n"
                  "[`docs/exact_diffuse_simulation_smoothing.md`](docs/exact_diffuse_simulation_smoothing.md).",
                  1,
              )
          if "## Exact diffuse conditional simulation smoothing" not in readme:
              marker = "## Observed-information inference"
              if marker not in readme:
                  raise RuntimeError("README inference marker missing")
              block = """## Exact diffuse conditional simulation smoothing

Version 0.0.25 draws complete latent-state and observation paths conditional on
the full observed sample:

```python
paths = exact_mle.simulate_smoothing_paths(
    n_simulations=2000,
    random_state=2026,
)

print(paths.state_paths.shape)
print(paths.observation_paths.shape)
print(paths.maximum_mean_discrepancy)
print(paths.maximum_covariance_discrepancy)
```

The implementation represents the initial state using flat diffuse coordinates
plus proper Gaussian source coordinates, eliminates identified diffuse
coordinates analytically, and conditions the remaining standard-normal source
vector through SVD. It never substitutes a large finite diffuse variance. The
dense reference algorithm independently reconstructs posterior marginal state
means and covariance and checks them against the exact information smoother
before returning paths. It is intended for moderate samples; sparse or
sequential simulation smoothing remains future work. See
[`docs/exact_diffuse_simulation_smoothing.md`](docs/exact_diffuse_simulation_smoothing.md).
"""
              readme = readme.replace(marker, block.rstrip() + "\n\n" + marker, 1)
          write("README.md", readme)

          for path in (
              "docs/exact_diffuse.md",
              "docs/exact_diffuse_mle.md",
              "docs/exact_diffuse_smoothing.md",
          ):
              text = read(path)
              text = text.replace(
                  "lag-one state covariance, disturbance smoothing, and simulation smoothing are\n  not",
                  "lag-one state covariance remains unavailable; primitive disturbance smoothing\n  and dense conditional simulation smoothing are",
              )
              text = text.replace(
                  "lag-one state\n  covariance, disturbance smoothing, and simulation smoothing are not",
                  "lag-one state covariance remains unavailable; primitive disturbance and dense\n  conditional simulation smoothing are",
              )
              text = text.replace(
                  "- no exact diffuse simulation smoother;",
                  "- dense exact diffuse simulation smoothing is available for moderate samples;",
              )
              text = text.replace(
                  "- no exact diffuse state or innovation disturbance smoothing;",
                  "- exact diffuse state and primitive innovation disturbance smoothing are available;",
              )
              text = text.replace(
                  "- exact diffuse marginal state smoothing is available, but lag-one state\n  covariance and disturbance smoothing are not;",
                  "- exact diffuse state, primitive disturbance, forecast-interval, and dense\n  conditional simulation operations are available, but lag-one state covariance\n  remains unavailable;",
              )
              text = text.replace(
                  "- forecast intervals are not yet exposed from this estimator;",
                  "- exact diffuse forecast intervals are available only after diffuse rank reaches zero;",
              )
              if "exact_diffuse_simulation_smoothing.md" not in text:
                  marker = "## Parameter uncertainty" if marker := ("## Parameter uncertainty" if "## Parameter uncertainty" in text else "## Validation references") else ""
                  block = """## Conditional simulation smoothing

Version 0.0.25 adds a dense exact conditional simulator for complete state and
observation paths. It uses flat diffuse coordinates and proper Gaussian source
coordinates, eliminates identified diffuse directions analytically, and checks
its marginal posterior against the exact information smoother. The final
diffuse rank must be zero. See
[Exact diffuse simulation smoothing](exact_diffuse_simulation_smoothing.md).
"""
                  if marker and marker in text:
                      text = text.replace(marker, block.rstrip() + "\n\n" + marker, 1)
              write(path, text)

          roadmap = read("docs/roadmap.md")
          if "## Implemented in 0.0.24: exact diffuse forecast intervals" not in roadmap:
              block24 = """## Implemented in 0.0.24: exact diffuse forecast intervals

- terminal-state draws from the finite exact diffuse filtered posterior;
- explicit refusal when final diffuse rank is nonzero;
- original-level and highest ordinary-difference interval facades;
- future primitive innovations propagated through the augmented integrated state;
- deterministic point forecasts retained as interval means;
- analytic state-variance, random-walk growth, stationary equivalence, and
  second-order integration tests;
- method guide, example, navigation, README, status, and Step 24 handoff.
"""
              roadmap = roadmap.replace("## Next priorities", block24.rstrip() + "\n\n## Next priorities", 1)
          if "## Implemented in 0.0.25: exact diffuse simulation smoothing" not in roadmap:
              block25 = """## Implemented in 0.0.25: exact diffuse simulation smoothing

- flat diffuse and proper Gaussian source-coordinate path representation;
- analytic elimination of identified diffuse coordinates;
- SVD conditioning of the remaining standard-normal source vector;
- complete conditional state and observation paths without a finite diffuse scale;
- independent dense posterior means and marginal covariance checked against the
  exact information smoother;
- immutable path, rank, residual, and discrepancy diagnostics;
- fitted training/new-data facade and reproducible seeded draws;
- closed-form bridge, fully observed, stationary incomplete, partial-location,
  unresolved-rank, and validation tests;
- explicit dense moderate-sample scale boundary;
- method guide, example, navigation, remaining-work inventory, and Step 25 handoff.
"""
              roadmap = roadmap.replace("## Next priorities", block25.rstrip() + "\n\n## Next priorities", 1)
          roadmap, count = re.subn(
              r"## Next priorities\n\n.*?\n\n## Research safeguards for future work",
              "## Next priorities\n\n"
              "1. Seasonal ordinary-seasonal diffuse state augmentation and original-level\n"
              "   exact likelihood.\n"
              "2. Seasonal exact diffuse smoothing, inference, and forecasting.\n"
              "3. Research the nontrivial diffuse `L2` recursion required for lag-one state\n"
              "   autocovariance and cross-time disturbance covariance.\n"
              "4. Robust, profile-likelihood, and parameter-uncertainty propagation.\n"
              "5. Sparse and memory-aware filtering, smoothing, forecasting, and simulation.\n"
              "6. Smooth admissibility parameterization and automatic order selection.\n"
              "7. Exogenous regressors, GIS adapters, cross-language fixtures, PyPI release,\n"
              "   parallel execution, and time-varying extensions.\n\n"
              "## Research safeguards for future work",
              roadmap,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError("roadmap priorities block was not replaced")
          safeguard = "- Treat the dense exact simulation smoother as a reference implementation,\n  not a large-system performance claim.\n"
          if safeguard not in roadmap:
              anchor = "- Distinguish final filtered-state uncertainty, future innovation uncertainty,\n  and parameter uncertainty.\n"
              if anchor not in roadmap:
                  raise RuntimeError("roadmap safeguard anchor missing")
              roadmap = roadmap.replace(anchor, anchor + safeguard, 1)
          write("docs/roadmap.md", roadmap)

          status = read("PROJECT_STATUS.md")
          status, count = re.subn(
              r"## Repository state\n\n.*?\n\n## Completed baseline through 0\.0\.18",
              "## Repository state\n\n"
              "- PR #1 through PR #24 have been squash-merged into `main`.\n"
              "- `main` is version `0.0.24` at merge commit\n"
              "  `0639f4bd932aa86020215b50b6ef9867bb5ad566`.\n"
              "- Current branch: `agent/exact-diffuse-simulation-smoothing`.\n"
              "- Current draft pull request: PR #25, `Add exact diffuse simulation smoothing`.\n"
              "- Current development version: `0.0.25`.\n"
              "- The branch adds dense exact conditional simulation of complete state and\n"
              "  observation paths under a flat diffuse-coordinate representation.\n"
              "- Lag-one diffuse autocovariance, seasonal exact diffuse augmentation, sparse\n"
              "  execution, and parameter-aware paths remain outside this stage.\n\n"
              "## Completed baseline through 0.0.18",
              status,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError("PROJECT_STATUS repository state was not replaced")
          block = """## Completed in 0.0.24

- exact diffuse original-level and highest-difference forecast intervals;
- finite terminal posterior and future innovation uncertainty;
- refusal when final diffuse rank remains nonzero;
- 207 tests and 87.30% total branch coverage in core CI #518.

## Completed in 0.0.25

- dense conditional simulation of complete latent-state and observation paths;
- flat diffuse coordinate plus proper Gaussian source representation;
- analytic diffuse-coordinate elimination and SVD Gaussian conditioning;
- no finite diffuse scale and no dependency on unavailable lag-one recursion;
- independent posterior marginal reconstruction checked against the exact
  information smoother to floating-point precision;
- immutable paths and diagnostics for ranks, constraint residuals, and marginal
  discrepancies;
- fitted training and new-data APIs, reproducibility, missing cells, and partial
  location observations;
- method guide, example, navigation, remaining-work inventory, and Step 25 handoff.

## Validation pending for 0.0.25

A complete CI must run on the synchronized public-documentation head. Record the
final run ID, test count, total coverage, and new-module coverage here before
merge.
"""
          if "## Completed in 0.0.25" not in status:
              marker = "## Design principles"
              if marker not in status:
                  raise RuntimeError("PROJECT_STATUS design marker missing")
              status = status.replace(marker, block.rstrip() + "\n\n" + marker, 1)
          status, count = re.subn(
              r"## Immediate next tasks\n\n.*?\n\n## Known limitations",
              "## Immediate next tasks\n\n"
              "1. Run final complete CI on the synchronized 0.0.25 documentation head.\n"
              "2. Record final run ID, test count, total coverage, and module coverage.\n"
              "3. Update PR #25, mark it ready, and squash-merge into `main`.\n"
              "4. Implement seasonal exact diffuse augmentation and original-level likelihood.\n"
              "5. Research diffuse `L2` lag-one autocovariance separately.\n"
              "6. Add robust/parameter-aware inference and sparse execution.\n\n"
              "## Known limitations",
              status,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError("PROJECT_STATUS immediate tasks were not replaced")
          status = status.replace(
              "smoothing are implemented, but lag-one state autocovariance, cross-time\n  disturbance covariance, and simulation smoothing are not;",
              "smoothing and dense conditional simulation smoothing are implemented, but\n  lag-one state autocovariance and cross-time disturbance covariance are not;",
              1,
          )
          status = status.replace(
              "- forecast intervals are not exposed from `ExactDiffuseKalmanSTARIMA`;",
              "- exact diffuse forecast intervals require zero final diffuse rank and condition\n  on fitted parameters;",
              1,
          )
          if "`docs/exact_diffuse_simulation_smoothing.md`," not in status:
              anchor = "`docs/exact_diffuse_inference.md`,\n"
              if anchor not in status:
                  raise RuntimeError("PROJECT_STATUS handoff anchor missing")
              status = status.replace(
                  anchor,
                  "`docs/exact_diffuse_simulation_smoothing.md`,\n"
                  "`docs/exact_diffuse_forecast_intervals.md`,\n"
                  + anchor,
                  1,
              )
          write("PROJECT_STATUS.md", status)
          PY
      - name: Commit synchronized documentation and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/sync-step25-public-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md PROJECT_STATUS.md docs/exact_diffuse.md docs/exact_diffuse_mle.md docs/exact_diffuse_smoothing.md docs/roadmap.md
          git commit -m "Synchronize Step 25 public documentation"
          git push origin HEAD:agent/exact-diffuse-simulation-smoothing
