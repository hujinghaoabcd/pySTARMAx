name: Validate and clean seasonal inference

on:
  push:
    branches:
      - agent/seasonal-likelihood-inference

permissions:
  contents: write

jobs:
  validate-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seasonal-likelihood-inference
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev,docs,test]"
      - run: python -m black --check src/pystarmax/seasonal_likelihood_inference.py tests/test_seasonal_likelihood_inference.py
      - run: python -m isort --check-only src/pystarmax/seasonal_likelihood_inference.py tests/test_seasonal_likelihood_inference.py
      - run: python -m ruff check src/pystarmax/seasonal_likelihood_inference.py tests/test_seasonal_likelihood_inference.py
      - run: python -m mypy
      - run: python -m pytest tests/test_seasonal_likelihood_inference.py -q
      - name: Remove temporary artifacts
        shell: bash
        run: |
          git rm -f --ignore-unmatch ci-seasonal-inference-diagnostic.txt
          git rm -f .github/workflows/validate-clean-seasonal-inference.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Clean seasonal inference diagnostics"
          git push
