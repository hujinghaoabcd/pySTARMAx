name: Fix current mypy aliases

on:
  push:
    branches: [agent/classic-stpacf-reference]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/classic-stpacf-reference
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Mark diagnostic aliases explicitly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/pystarmax/diagnostics.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "from typing import Any, Literal, cast",
              "from typing import Any, Literal, TypeAlias, cast",
          )
          text = text.replace(
              'STPACFMethod = Literal["yule-walker", "regression"]',
              'STPACFMethod: TypeAlias = Literal["yule-walker", "regression"]',
          )
          text = text.replace(
              'YuleWalkerSolver = Literal["auto", "solve", "lstsq"]',
              'YuleWalkerSolver: TypeAlias = Literal["auto", "solve", "lstsq"]',
          )
          path.write_text(text, encoding="utf-8")
          PY
      - run: python -m pip install --upgrade pip black isort
      - run: python -m black src/pystarmax/diagnostics.py
      - run: python -m isort src/pystarmax/diagnostics.py
      - name: Commit type-alias fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pystarmax/diagnostics.py
          git commit -m "Declare diagnostic type aliases"
          git push origin HEAD:agent/classic-stpacf-reference
