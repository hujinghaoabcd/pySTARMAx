name: Export exact diffuse inference API

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  export:
    if: github.event.pull_request.head.ref == 'agent/exact-diffuse-inference'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exact-diffuse-inference
      - name: Update exports and version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          init = Path("src/pystarmax/__init__.py")
          text = init.read_text()
          text = text.replace('__version__ = "0.0.22"', '__version__ = "0.0.23"', 1)
          marker = '''from pystarmax.exact_diffuse_disturbance_smoothing import (
              ExactDiffuseDisturbanceResult,
              exact_diffuse_disturbance_smoother,
          )
          '''
          insertion = marker + '''from pystarmax.exact_diffuse_inference import (
              infer_exact_diffuse_kalman_starima,
          )
          '''
          if marker not in text:
              raise SystemExit("exact diffuse disturbance import marker not found")
          text = text.replace(marker, insertion, 1)
          export_marker = '    "exact_diffuse_disturbance_smoother",\n'
          if export_marker not in text:
              raise SystemExit("exact diffuse disturbance export marker not found")
          text = text.replace(
              export_marker,
              export_marker + '    "infer_exact_diffuse_kalman_starima",\n',
              1,
          )
          init.write_text(text)

          citation = Path("CITATION.cff")
          citation_text = citation.read_text()
          if "version: 0.0.22" not in citation_text:
              raise SystemExit("citation version marker not found")
          citation.write_text(citation_text.replace("version: 0.0.22", "version: 0.0.23", 1))

          Path(".github/workflows/export-exact-diffuse-inference.yml").unlink()
          PY
      - name: Commit exports
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Export exact diffuse inference API"
          git push origin HEAD:agent/exact-diffuse-inference
