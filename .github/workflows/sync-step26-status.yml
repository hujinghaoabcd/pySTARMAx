name: Synchronize Step 26 status

on:
  push:
    branches:
      - agent/seasonal-exact-diffuse-state-space

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seasonal-exact-diffuse-state-space
          fetch-depth: 0
      - name: Synchronize public status documents
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          replacement = """> **Status — 0.0.26:** stationary, conditional ordinary-integrated,
          > exact-diffuse ordinary-integrated, multiplicative seasonal Gaussian Kalman
          > STARIMA estimation, and a fixed-parameter seasonal exact diffuse original-
          > level state-space/filter/likelihood foundation for
          > `(1-B)^d(1-B^s)^D`; observed-information and natural covariance inference;
          > missing-data filtering; ordinary and exact diffuse smoothing and disturbance
          > smoothing; Gaussian and exact diffuse forecast intervals; and dense exact
          > diffuse conditional simulation smoothing. Optimizer-facing seasonal exact
          > diffuse MLE, seasonal posterior operations, diffuse lag-one covariance,
          > parameter-aware paths, sparse computation, exogenous regressors, and time-
          > varying extensions remain planned."""
          text, count = re.subn(
              r"> \*\*Status — 0\.0\.25:\*\*.*?> extensions remain planned\.",
              replacement,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError("README status block was not replaced")
          readme.write_text(text, encoding="utf-8")

          roadmap = Path("docs/roadmap.md")
          text = roadmap.read_text(encoding="utf-8")
          section = """## Implemented in 0.0.26: seasonal exact diffuse state-space foundation

          - fixed-parameter original-level augmentation for
            `(1-B)^d(1-B^s)^D` integration;
          - explicit combined differencing polynomial and auditable original-level lag
            companion state;
          - exact diffuse covariance on all `(d+Ds)n` integration coordinates;
          - stationary finite initialization for the transformed STARMA state;
          - exact diffuse filtering and original-level Gaussian likelihood;
          - exact delegation to the ordinary integrated constructor when `D=0`;
          - closed-form seasonal random-walk likelihood reference;
          - explicit `(1-B)(1-B^2)` matrix and transformed-residual references;
          - missing-observation diffuse-rank tests and immutable initialization arrays;
          - public exports, method guide, runnable example, navigation, status inventory,
            and Step 26 handoff.

          """
          if "## Implemented in 0.0.26" not in text:
              marker = "## Next priorities"
              if marker not in text:
                  raise RuntimeError("roadmap priority marker missing")
              text = text.replace(marker, section + marker, 1)
          priorities = """## Next priorities

          1. Optimizer-facing seasonal exact diffuse MLE with multiplicative factor
             parameter counting and expanded admissibility checks.
          2. Seasonal exact diffuse smoothing, likelihood inference, and original-level
             forecasting built on the common 0.0.26 state contract.
          3. Research and implement the diffuse `L2` recursion required for lag-one
             state autocovariance and cross-time disturbance covariance.
          4. Robust/profile-likelihood and parameter-uncertainty propagation.
          5. Sparse state matrices, memory-aware execution, and reproducible parallel
             paths.
          6. Smooth admissibility parameterization and automatic order/spatial-lag
             selection.
          7. Exogenous regressors, intervention variables, GIS adapters,
             cross-language fixtures, public PyPI automation, and time-varying models.

          ## Research safeguards for future work"""
          text, count = re.subn(
              r"## Next priorities\n\n.*?\n\n## Research safeguards for future work",
              priorities,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError("roadmap priority block was not replaced")
          roadmap.write_text(text, encoding="utf-8")

          status = Path("PROJECT_STATUS.md")
          text = status.read_text(encoding="utf-8")
          repository_state = """## Repository state

          - PR #1 through PR #25 have been squash-merged into `main`.
          - `main` is version `0.0.25` at merge commit
            `ac7c049e16889046391e8b324970dbc8d9e8798b`.
          - Current branch: `agent/seasonal-exact-diffuse-state-space`.
          - Current draft pull request: PR #26,
            `Add seasonal exact diffuse state-space foundation`.
          - Current development version: `0.0.26`.
          - PR #26 adds the fixed-parameter original-level state augmentation, exact
            diffuse filter, and likelihood for `(1-B)^d(1-B^s)^D`.
          - Optimizer-facing seasonal exact diffuse MLE and seasonal posterior operations
            remain outside this stage.

          ## Public model families"""
          text, count = re.subn(
              r"## Repository state\n\n.*?\n\n## Public model families",
              repository_state,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError("PROJECT_STATUS repository block was not replaced")

          completed = """## Completed in 0.0.26

          ### Seasonal exact diffuse state-space foundation

          - constructs the original-level state for the complete combined polynomial
            `(1-B)^d(1-B^s)^D`;
          - stores an auditable level-lag companion for positive seasonal order;
          - initializes all `(d+Ds)n` integration coordinates as exact diffuse;
          - initializes the transformed STARMA subsystem from its stationary finite
            distribution;
          - exposes exact diffuse filtering and original-level likelihood routes;
          - delegates exactly to the ordinary integrated constructor when `D=0`;
          - preserves missing-observation and immutable-result contracts;
          - includes analytic seasonal-random-walk and direct matrix references.

          ### Deliberate boundary

          Version 0.0.26 does not include optimizer-facing seasonal exact diffuse MLE,
          seasonal exact diffuse smoothing, inference, forecasting, parameter-aware
          paths, or sparse execution.

          """
          if "## Completed in 0.0.26" not in text:
              marker = "## Numerical and research safeguards"
              if marker not in text:
                  raise RuntimeError("PROJECT_STATUS safeguards marker missing")
              text = text.replace(marker, completed + marker, 1)

          text = text.replace(
              "- seasonal ordinary-seasonal exact diffuse augmentation, likelihood, smoothing,\n  inference, forecasting, and simulation are unavailable;",
              "- seasonal exact diffuse fixed-parameter augmentation, filtering, and\n  original-level likelihood are available, but optimizer-facing MLE, smoothing,\n  inference, forecasting, and simulation facades are unavailable;",
              1,
          )
          tasks = """## Immediate next tasks

          1. Complete cross-platform validation of PR #26 and record test and coverage
             results.
          2. Confirm no temporary workflow, generated artifact, review thread, or
             unaddressed comment remains.
          3. Mark PR #26 ready and squash-merge version 0.0.26 into `main`.
          4. Start optimizer-facing seasonal exact diffuse MLE from the merged state
             contract.
          5. Add seasonal smoothing, inference, and forecasting only after the fitted
             model contract is independently validated.
          6. Research the diffuse `L2` lag-one covariance recursion separately.
          7. Continue robust inference, parameter-aware paths, sparse execution, model
             selection, and ecosystem work listed in the remaining-work inventory.

          ## Handoff instruction"""
          text, count = re.subn(
              r"## Immediate next tasks\n\n.*?\n\n## Handoff instruction",
              tasks,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError("PROJECT_STATUS task block was not replaced")
          handoff_marker = "- `docs/development/REMAINING_WORK.md`;\n"
          if "STEP_26_SEASONAL_EXACT_DIFFUSE_STATE_SPACE.md" not in text:
              text = text.replace(
                  handoff_marker,
                  handoff_marker
                  + "- `docs/development/STEP_26_SEASONAL_EXACT_DIFFUSE_STATE_SPACE.md`;\n"
                  + "- `docs/exact_seasonal_integrated.md`;\n",
                  1,
              )
          status.write_text(text, encoding="utf-8")

          index = Path("docs/index.md")
          text = index.read_text(encoding="utf-8")
          old = (
              "simulation of complete latent state paths, conditional and bootstrap "
              "intervals,\nand rolling-origin calibration diagnostics."
          )
          new = (
              "simulation of complete latent state paths, a fixed-parameter seasonal "
              "exact diffuse\noriginal-level state/filter/likelihood foundation, "
              "conditional and bootstrap intervals,\nand rolling-origin calibration "
              "diagnostics."
          )
          if old not in text:
              raise RuntimeError("docs index capability marker missing")
          index.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit synchronized status and remove helper workflow
        shell: bash
        run: |
          git rm .github/workflows/sync-step26-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/roadmap.md PROJECT_STATUS.md docs/index.md
          git commit -m "Synchronize Step 26 project status"
          git push origin HEAD:agent/seasonal-exact-diffuse-state-space
