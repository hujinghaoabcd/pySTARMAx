name: Patch Step 25 status documents

on:
  push:
    branches:
      - agent/exact-diffuse-simulation-smoothing

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exact-diffuse-simulation-smoothing
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Patch retained status documents
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "README.md",
              '''> **Status — 0.0.23:** stationary, conditional ordinary-integrated,
          > exact-diffuse ordinary-integrated, and multiplicative seasonal Gaussian
          > Kalman STARMA/STARIMA estimation; expanded AR stationarity and positive-sign
          > MA invertibility diagnostics; observed-information Hessian and natural
          > covariance inference for stationary, conditional integrated, seasonal, and
          > original-level exact diffuse likelihoods; missing-data filtering; ordinary
          > RTS and exact diffuse fixed-interval state smoothing; ordinary and exact
          > diffuse primitive innovation/state-disturbance smoothing; fixed-parameter
          > Gaussian forecast intervals; and optimizer-facing exact diffuse ordinary
          > STARIMA likelihood. Exact diffuse lag-one autocovariance, simulation
          > smoothing, seasonal diffuse augmentation, sparse computation, exogenous
          > regressors, and time-varying extensions remain planned.
          ''',
              '''> **Status — 0.0.25:** stationary, conditional ordinary-integrated,
          > exact-diffuse ordinary-integrated, and multiplicative seasonal Gaussian
          > Kalman STARMA/STARIMA estimation; expanded AR stationarity and positive-sign
          > MA invertibility diagnostics; observed-information Hessian and natural
          > covariance inference for stationary, conditional integrated, seasonal, and
          > original-level exact diffuse likelihoods; missing-data filtering; ordinary
          > RTS and exact diffuse fixed-interval state smoothing; ordinary and exact
          > diffuse primitive innovation/state-disturbance smoothing; fixed-parameter
          > Gaussian and exact diffuse forecast intervals; and dense exact diffuse
          > conditional simulation of complete state and observation paths. Exact
          > diffuse lag-one autocovariance, seasonal diffuse augmentation, parameter-
          > aware paths, sparse computation, exogenous regressors, and time-varying
          > extensions remain planned.
          ''',
          )

          replace_once("PROJECT_STATUS.md", "Updated: 2026-08-04", "Updated: 2026-08-05")
          replace_once(
              "PROJECT_STATUS.md",
              '''- PR #1 through PR #22 have been squash-merged into `main`.
          - `main` is version `0.0.22` at merge commit
            `6a9f4cf9d9e19edd54123b22a892f36b7daf7b66`.
          - Current branch: `agent/exact-diffuse-inference`.
          - Current draft pull request: PR #23, `Add exact diffuse likelihood inference`.
          - Current development version: `0.0.23`.
          - The branch adds observed-information and natural innovation covariance
            inference for the original-level exact diffuse STARIMA likelihood.
          - Analytic derivatives, robust covariance, parameter-uncertainty propagation,
            and seasonal exact diffuse inference remain explicitly outside this stage.
          ''',
              '''- PR #1 through PR #24 have been squash-merged into `main`.
          - `main` is version `0.0.24` at merge commit
            `0639f4bd932aa86020215b50b6ef9867bb5ad566`.
          - PR #24 added original-level and highest-difference exact diffuse forecast
            intervals. CI #518 and merge-gate CI #519 passed 207 tests with 87.30%
            total branch coverage.
          - Current branch: `agent/exact-diffuse-simulation-smoothing`.
          - Current draft pull request: PR #25, `Add exact diffuse simulation smoothing`.
          - Current development version: `0.0.25`.
          - PR #25 adds dense exact diffuse conditional simulation of complete state and
            observation paths by analytically eliminating flat diffuse coordinates and
            conditioning a proper Gaussian source vector on observed cells.
          - Lag-one exact diffuse autocovariance, primitive innovation paths, cross-time
            disturbance covariance, seasonal diffuse augmentation, parameter-aware
            paths, and sparse execution remain explicitly outside this stage.
          ''',
          )

          roadmap_marker = "## Next priorities\n"
          roadmap_insert = '''## Implemented in 0.0.24: exact diffuse forecast intervals

          - original-level and highest ordinary-difference fixed-parameter forecast
            intervals for `ExactDiffuseKalmanSTARIMA`;
          - terminal exact diffuse rank-zero requirement and explicit refusal of an
            improper terminal posterior;
          - direct augmented-state path simulation with terminal filtered-state and
            future process-innovation uncertainty;
          - deterministic recursive point forecasts retained as interval centers;
          - analytic state-variance, random-walk, second-order integration,
            reproducibility, validation, and immutable-result tests;
          - method guide, runnable example, navigation, citation metadata, and Step 24
            handoff.

          ## Implemented in 0.0.25: exact diffuse simulation smoothing

          - dense conditional simulation of complete latent state and observation paths;
          - explicit flat diffuse coordinates and proper finite Gaussian source
            coordinates;
          - analytic diffuse-coordinate elimination and left-null-space conditioning;
          - no large finite diffuse variance and no dependence on unavailable diffuse
            lag-one covariance;
          - deterministic posterior marginal mean and covariance agreement with the
            exact diffuse information smoother;
          - random-walk bridge, deterministic fully observed path, stationary
            zero-diffuse, partial-location, fitted-route, reproducibility, immutability,
            and unresolved-rank tests;
          - method guide, runnable example, navigation, remaining-work inventory, and
            Step 25 handoff.

          ## Next priorities
          '''
          replace_once("docs/roadmap.md", roadmap_marker, roadmap_insert)
          replace_once(
              "docs/roadmap.md",
              '''1. Forecast intervals for the exact diffuse estimator.
          2. Exact diffuse simulation smoothing.
          3. Seasonal ordinary-seasonal diffuse state augmentation, smoothing, and
             inference.
          4. Research the nontrivial diffuse `L2` recursion required for lag-one state
             autocovariance and cross-time disturbance covariance.
          5. Robust, profile-likelihood, and parameter-uncertainty propagation for exact
             diffuse inference.
          6. Parameter-aware paths, sparse state matrices, and cross-time innovation
             covariance.
          7. Smooth admissibility parameterization and automatic order selection.
          8. Exogenous regressors, GIS adapters, cross-language fixtures, PyPI release,
             parallel execution, robust inference, and time-varying extensions.
          ''',
              '''1. Seasonal ordinary-seasonal exact diffuse state augmentation,
             likelihood, smoothing, inference, and forecasting.
          2. Research and implement the diffuse `L2` recursion required for lag-one
             state autocovariance and cross-time disturbance covariance.
          3. Robust, profile-likelihood, analytic-derivative, and parameter-uncertainty
             propagation for exact diffuse inference.
          4. Parameter-aware paths, sparse state matrices, memory-aware execution, and
             cross-time innovation covariance.
          5. Smooth admissibility parameterization and automatic order/spatial-lag
             selection.
          6. Exogenous regressors, intervention variables, GIS adapters,
             cross-language fixtures, and public PyPI release automation.
          7. Parallel execution, reproducible chunking, and explicitly time-varying
             state-space extensions.
          ''',
          )

          replace_once(
              "docs/exact_diffuse_mle.md",
              '''These are fixed-parameter point forecasts. Forecast interval simulation from
          the exact diffuse estimator is not yet exposed.
          ''',
              '''Version 0.0.24 adds fixed-parameter original-level and highest-
          difference forecast intervals through `predict_interval()` and
          `predict_differenced_interval()`. They require a resolved terminal diffuse
          rank and propagate terminal finite-state uncertainty plus future process
          innovations. See
          [Exact diffuse forecast intervals](exact_diffuse_forecast_intervals.md).
          ''',
          )
          replace_once(
              "docs/exact_diffuse_mle.md",
              '''[Exact diffuse disturbance smoothing](exact_diffuse_disturbance_smoothing.md).

          ## Observed-information and natural covariance inference
          ''',
              '''[Exact diffuse disturbance smoothing](exact_diffuse_disturbance_smoothing.md).

          ## Conditional simulation smoothing

          Version 0.0.25 adds:

          ```python
          paths = model.simulate_smoothing_paths(
              n_simulations=2000,
              random_state=2026,
          )
          ```

          Flat diffuse coordinates are eliminated analytically and the remaining proper
          Gaussian source coordinates are conditioned on all observed cells. The dense
          route returns complete state and observation paths and checks its deterministic
          marginal means and covariances against the exact information smoother. It does
          not use a large finite diffuse scale. See
          [Exact diffuse simulation smoothing](exact_diffuse_simulation_smoothing.md).

          ## Observed-information and natural covariance inference
          ''',
          )
          replace_once(
              "docs/exact_diffuse_mle.md",
              '''- exact diffuse marginal state and primitive innovation/state-disturbance
            smoothing are available, but lag-one state autocovariance and cross-time
            disturbance covariance are not;
          - seasonal diffuse state augmentation and smoothing are not implemented;
          - forecast intervals are not yet exposed from this estimator;
          ''',
              '''- exact diffuse marginal state and primitive innovation/state-disturbance
            smoothing plus dense conditional state/observation path simulation are
            available, but primitive innovation paths, lag-one state autocovariance, and
            cross-time disturbance covariance are not;
          - seasonal diffuse state augmentation and smoothing are not implemented;
          - forecast intervals are fixed-parameter and do not include estimation
            uncertainty;
          ''',
          )
          PY
      - name: Commit synchronized documents and remove workflow
        run: |
          git rm .github/workflows/patch-step25-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md PROJECT_STATUS.md docs/roadmap.md docs/exact_diffuse_mle.md
          git commit -m "Synchronize 0.0.24 and 0.0.25 project status"
          git push origin HEAD:agent/exact-diffuse-simulation-smoothing
