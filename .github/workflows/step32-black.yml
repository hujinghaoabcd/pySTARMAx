name: Step 32 Black

on:
  push:
    branches:
      - agent/exact-diffuse-lag-one-covariance
    paths:
      - .github/workflows/step32-black.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exact-diffuse-lag-one-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install black==26.5.1
      - run: python -m black tests/test_exact_diffuse_lag_one_covariance.py
      - run: rm .github/workflows/step32-black.yml
      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_exact_diffuse_lag_one_covariance.py .github/workflows/step32-black.yml
          git commit -m "Apply Black to Step 32 tests"
          git push origin HEAD:agent/exact-diffuse-lag-one-covariance
