name: Sort forecasting test imports

on:
  push:
    branches: [agent/original-scale-forecast-intervals]

permissions:
  contents: write

jobs:
  sort:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/original-scale-forecast-intervals
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply project isort version
        shell: bash
        run: |
          python -m pip install -e '.[dev]'
          python -m isort tests/test_forecasting.py
          rm .github/workflows/sort-forecasting-imports.yml
          git diff --check
      - name: Commit import ordering and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sort forecasting test imports"
          git push origin HEAD:agent/original-scale-forecast-intervals
