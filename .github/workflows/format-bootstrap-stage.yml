name: Normalize bootstrap stage

on:
  push:
    branches: [agent/bootstrap-forecast-intervals]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-forecast-intervals
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Format and validate bootstrap implementation
        shell: bash
        run: |
          python -m pip install -e '.[dev,test]'
          python -m black src tests tools examples
          python -m isort src tests tools examples
          python -m ruff check src tests tools examples
          python -m mypy
          python -m pytest tests/test_bootstrap.py -q
          rm .github/workflows/format-bootstrap-stage.yml
          git diff --check
      - name: Commit normalized sources and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize bootstrap implementation"
          git push origin HEAD:agent/bootstrap-forecast-intervals
