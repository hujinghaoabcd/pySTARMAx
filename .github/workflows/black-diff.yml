name: Black autoformat cleanup

on:
  push:
    branches:
      - agent/seasonal-exact-diffuse-forecasting

permissions:
  contents: write

jobs:
  black-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seasonal-exact-diffuse-forecasting
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install black==26.5.1
      - run: python -m black src/pystarmax/seasonal_exact_diffuse_forecasting.py tests/test_seasonal_exact_diffuse_public_api.py
      - name: Commit formatter output and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/black-diff.yml
          git add src/pystarmax/seasonal_exact_diffuse_forecasting.py tests/test_seasonal_exact_diffuse_public_api.py
          git commit -m "Apply Black formatting and remove diagnostic workflow"
          git push origin HEAD:agent/seasonal-exact-diffuse-forecasting
