name: Format development branch

on:
  push:
    branches: [agent/initial-starma-core]

permissions:
  contents: write

jobs:
  black:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/initial-starma-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip black
      - run: python -m black src tests examples
      - name: Commit Black formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests examples
          git commit -m "Apply Black formatting"
          git push origin HEAD:agent/initial-starma-core
