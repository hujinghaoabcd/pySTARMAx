name: Format exact diffuse disturbance changes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'agent/exact-diffuse-disturbance-smoothing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exact-diffuse-disturbance-smoothing
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Format new files
        run: |
          python -m pip install black==26.5.1 isort==8.0.1
          python -m black \
            src/pystarmax/exact_diffuse_disturbance_smoothing.py \
            tests/test_exact_diffuse_disturbance_smoothing.py \
            tests/test_exact_diffuse_disturbance_model.py
          python -m isort \
            src/pystarmax/exact_diffuse_disturbance_smoothing.py \
            tests/test_exact_diffuse_disturbance_smoothing.py \
            tests/test_exact_diffuse_disturbance_model.py
          rm .github/workflows/format-exact-diffuse-disturbance.yml
      - name: Commit formatted files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Format exact diffuse disturbance changes"
          git push origin HEAD:agent/exact-diffuse-disturbance-smoothing
