name: Format Step 27

on:
  push:
    branches:
      - agent/seasonal-exact-diffuse-mle

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seasonal-exact-diffuse-mle
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install black==26.5.1
      - name: Format and commit
        shell: bash
        run: |
          python -m black src/pystarmax/seasonal_exact_diffuse_mle.py tests/test_seasonal_exact_diffuse_mle.py
          git rm .github/workflows/format-step27.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pystarmax/seasonal_exact_diffuse_mle.py tests/test_seasonal_exact_diffuse_mle.py
          git commit -m "Format seasonal exact diffuse MLE"
          git push origin HEAD:agent/seasonal-exact-diffuse-mle
