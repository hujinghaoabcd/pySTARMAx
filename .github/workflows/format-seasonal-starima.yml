name: Format seasonal STARIMA

on:
  push:
    branches: [agent/original-scale-forecast-intervals]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/original-scale-forecast-intervals
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply project Black version
        shell: bash
        run: |
          python -m pip install -e '.[dev]'
          python -m black src/pystarmax/models/seasonal_starima.py
          rm .github/workflows/format-seasonal-starima.yml
          git diff --check
      - name: Commit formatting and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format seasonal STARIMA model"
          git push origin HEAD:agent/original-scale-forecast-intervals
