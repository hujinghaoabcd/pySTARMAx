name: Record Kalman interval validation

on:
  push:
    branches:
      - agent/kalman-original-scale-intervals

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kalman-original-scale-intervals
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Update validation records
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          status_path = Path("PROJECT_STATUS.md")
          status = status_path.read_text()
          start = status.index("## Core validation for 0.0.18")
          end = status.index("## Prior validation for 0.0.17")
          validation = '''## Authoritative validation for 0.0.18

          GitHub Actions CI #403, run ID `30878184542`, validated the complete
          implementation, tests, example, metadata, README, method guides, navigation,
          roadmap, project status, and Step 18 documentation head:

          - 155 tests passed in the coverage job;
          - total branch coverage was 87.09%, above the required 80%;
          - `src/pystarmax/kalman_forecasting.py` coverage was 80.2%;
          - `src/pystarmax/integrated_maximum_likelihood.py` coverage was 84.3%;
          - `src/pystarmax/seasonal_forecasting.py` coverage was 89.5%;
          - Black, isort, Ruff, and mypy passed;
          - independent diagnostic-reference regeneration produced a clean diff;
          - strict MkDocs passed;
          - source distribution, wheel, and Twine checks passed;
          - Ubuntu, Windows, and macOS passed on Python 3.11, 3.12, 3.13, and 3.14.

          A validation-record-only merge-gate CI is required after this status and the
          Step 18 handoff are updated. No implementation, test, API, example, README, or
          method-guide changes are made after CI #403.

          '''
          status = status[:start] + validation + status[end:]

          old_tasks = '''## Immediate next tasks

          1. Run the complete final CI matrix on the documentation head.
          2. Record the final run identifier, test count, and coverage in this status and
             the Step 18 handoff.
          3. Update PR #18, mark it ready, and squash-merge it into `main`.
          4. Design exact diffuse integrated level-state likelihood and smoothing as a
             separate API.
          5. Add parameter-aware Kalman paths using constrained observed-information or
             model-refitting bootstrap draws.
          6. Add sparse arbitrary-lag state matrices, cross-time innovation covariance,
             simulation smoothing, order selection, exogenous inputs, adapters, and
             cross-language fixtures.
          '''
          new_tasks = '''## Immediate next tasks

          1. Run the validation-record-only merge-gate CI.
          2. Update PR #18, mark it ready, and squash-merge it into `main`.
          3. Design exact diffuse integrated level-state likelihood and smoothing as a
             separate API.
          4. Add parameter-aware Kalman paths using constrained observed-information or
             model-refitting bootstrap draws.
          5. Add sparse arbitrary-lag state matrices, cross-time innovation covariance,
             simulation smoothing, order selection, exogenous inputs, adapters, and
             cross-language fixtures.
          '''
          if old_tasks not in status:
              raise SystemExit("PROJECT_STATUS immediate tasks block not found")
          status_path.write_text(status.replace(old_tasks, new_tasks, 1))

          step_path = Path("docs/development/STEP_18_KALMAN_FORECAST_INTERVALS.md")
          step = step_path.read_text()
          old_position = '''- core validation: GitHub Actions CI #394, run ID `30877591713`;
          - core result: 155 tests passed and 87.09% total branch coverage;
          - `src/pystarmax/kalman_forecasting.py` coverage: 80.2%;
          - a complete final documentation-head CI is required before merge.
          '''
          new_position = '''- authoritative implementation/documentation validation: GitHub Actions CI
            #403, run ID `30878184542`;
          - validation result: 155 tests passed and 87.09% total branch coverage;
          - `src/pystarmax/kalman_forecasting.py` coverage: 80.2%;
          - Black, isort, Ruff, mypy, strict MkDocs, distributions, and Ubuntu/Windows/
            macOS Python 3.11–3.14 all passed;
          - a validation-record-only merge-gate CI is required before merge.
          '''
          if old_position not in step:
              raise SystemExit("Step 18 repository position block not found")
          step = step.replace(old_position, new_position, 1)

          old_ci = '''Core CI #394 reported:

          - 155 tests passed in 63.51 seconds;
          - total branch coverage: 87.09%;
          - Kalman forecast module coverage: 80.2%;
          - ordinary integrated core coverage: 84.3%;
          - seasonal forecast facade coverage: 89.5%;
          - Black, isort, Ruff, mypy, strict MkDocs, distributions, and diagnostic fixture
            regeneration passed;
          - Ubuntu, Windows, and macOS passed on Python 3.11, 3.12, 3.13, and 3.14.
          '''
          new_ci = '''Authoritative CI #403 reported:

          - 155 tests passed in 36.77 seconds in the coverage job;
          - total branch coverage: 87.09%;
          - Kalman forecast module coverage: 80.2%;
          - ordinary integrated core coverage: 84.3%;
          - seasonal forecast facade coverage: 89.5%;
          - Black, isort, Ruff, mypy, strict MkDocs, distributions, and diagnostic fixture
            regeneration passed;
          - Ubuntu, Windows, and macOS passed on Python 3.11, 3.12, 3.13, and 3.14.

          The validation-record-only head changes only this handoff and
          `PROJECT_STATUS.md`. It receives one final merge-gate CI before PR #18 is
          marked ready and merged.
          '''
          if old_ci not in step:
              raise SystemExit("Step 18 validation block not found")
          step_path.write_text(step.replace(old_ci, new_ci, 1))
          PY
      - name: Commit validation records and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/record-kalman-interval-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATUS.md docs/development/STEP_18_KALMAN_FORECAST_INTERVALS.md
          git commit -m "Record final Kalman interval validation"
          git push
