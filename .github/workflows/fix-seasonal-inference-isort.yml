name: Fix seasonal inference imports

on:
  push:
    branches:
      - agent/seasonal-likelihood-inference

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seasonal-likelihood-inference
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install isort==8.0.1
      - run: python -m isort src/pystarmax/seasonal_likelihood_inference.py
      - name: Commit imports and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-seasonal-inference-isort.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pystarmax/seasonal_likelihood_inference.py
          git commit -m "Sort seasonal likelihood inference imports"
          git push
