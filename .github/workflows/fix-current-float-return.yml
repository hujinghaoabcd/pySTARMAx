name: Fix current float return

on:
  push:
    branches: [agent/classic-stpacf-reference]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/classic-stpacf-reference
      - name: Make covariance return explicitly typed
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/pystarmax/diagnostics.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "    return total / (n_pairs * data.shape[1])",
              "    return float(total / (n_pairs * data.shape[1]))",
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit float return fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pystarmax/diagnostics.py
          git commit -m "Make covariance return explicitly typed"
          git push origin HEAD:agent/classic-stpacf-reference
