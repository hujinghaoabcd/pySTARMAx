name: Format Step 25 changes

on:
  push:
    branches:
      - agent/exact-diffuse-simulation-smoothing

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exact-diffuse-simulation-smoothing
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Format new files
        run: |
          python -m pip install black==26.5.1 isort==8.0.1
          python -m black src/pystarmax/exact_diffuse_simulation_smoothing.py tests/test_exact_diffuse_simulation_smoothing.py
          python -m isort src/pystarmax/exact_diffuse_simulation_smoothing.py tests/test_exact_diffuse_simulation_smoothing.py
      - name: Commit formatted files and remove workflow
        run: |
          git rm .github/workflows/format-step25.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pystarmax/exact_diffuse_simulation_smoothing.py tests/test_exact_diffuse_simulation_smoothing.py
          git commit -m "Format exact diffuse simulation smoother"
          git push origin HEAD:agent/exact-diffuse-simulation-smoothing
