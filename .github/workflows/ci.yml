name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PYTHONWARNINGS: "default"
  PYTHONUTF8: "1"

jobs:
  format-mle:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/kalman-maximum-likelihood'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kalman-maximum-likelihood
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/pystarmax/maximum_likelihood.py")
          text = path.read_text(encoding="utf-8")
          old = '''    scale = max(1.0, float(np.max(np.abs(eigenvalues), initial=0.0)))
    if float(np.min(eigenvalues, initial=0.0)) <= 0.0:
        if float(np.min(eigenvalues, initial=0.0)) < -1e-10 * scale:
            raise ValueError("innovation_covariance must be positive definite")
        raise ValueError("innovation_covariance must be strictly positive definite")
'''
          new = '''    scale = max(1.0, float(np.max(np.abs(eigenvalues), initial=0.0)))
    minimum = float(np.min(eigenvalues))
    if minimum <= 0.0:
        if minimum < -1e-10 * scale:
            raise ValueError("innovation_covariance must be positive definite")
        raise ValueError("innovation_covariance must be strictly positive definite")
'''
          if old in text:
              path.write_text(text.replace(old, new), encoding="utf-8")
          elif "minimum = float(np.min(eigenvalues))" not in text:
              raise SystemExit("target covariance validation block not found")
          PY
      - run: python -m pip install black==26.5.1 isort==8.0.1
      - run: python -m isort src/pystarmax/maximum_likelihood.py tests/test_maximum_likelihood.py
      - run: python -m black src/pystarmax/maximum_likelihood.py tests/test_maximum_likelihood.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pystarmax/maximum_likelihood.py tests/test_maximum_likelihood.py
          git diff --cached --quiet || git commit -m "Fix and format Kalman likelihood implementation"
          git push origin HEAD:agent/kalman-maximum-likelihood

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,docs]"
      - run: python -m black --check src tests tools examples
      - run: python -m isort --check-only src tests tools examples
      - run: python -m ruff check src tests tools examples
      - run: python -m mypy
      - run: python tools/generate_classic_diagnostics_reference.py
      - run: git diff --exit-code -- tests/reference/classic_diagnostics_v1.json
      - run: python -m mkdocs build --strict

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pip check
      - run: python -m pytest -q

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest --cov=pystarmax --cov-branch --cov-report=term-missing --cov-report=xml -q

  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
