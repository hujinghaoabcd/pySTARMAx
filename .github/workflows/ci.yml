name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PYTHONWARNINGS: "default"
  PYTHONUTF8: "1"

jobs:
  repair-inference:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/kalman-likelihood-inference'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kalman-likelihood-inference
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python - <<'PY'
          from pathlib import Path

          inference = Path("src/pystarmax/likelihood_inference.py")
          text = inference.read_text(encoding="utf-8")
          text = text.replace(
              "from pystarmax.state_space import Initialization, build_starma_state_space, kalman_filter",
              "from pystarmax.state_space import (\n"
              "    Initialization,\n"
              "    build_starma_state_space,\n"
              "    kalman_filter,\n"
              ")",
          )
          old = '''    with np.errstate(divide="ignore", invalid="ignore"):
        z_values = estimates / standard_errors
    p_values = 2.0 * stats.norm.sf(np.abs(z_values))
    denominator = np.outer(standard_errors, standard_errors)
    correlation = np.divide(
        covariance,
        denominator,
        out=np.full_like(covariance, np.nan),
        where=denominator > 0.0,
    )
    np.fill_diagonal(correlation, np.where(standard_errors > 0.0, 1.0, np.nan))
'''
          new = '''    z_values = np.divide(
        estimates,
        standard_errors,
        out=np.zeros_like(estimates),
        where=standard_errors > 0.0,
    )
    p_values = 2.0 * stats.norm.sf(np.abs(z_values))
    denominator = np.outer(standard_errors, standard_errors)
    correlation = np.divide(
        covariance,
        denominator,
        out=np.zeros_like(covariance),
        where=denominator > 0.0,
    )
    np.fill_diagonal(
        correlation,
        np.where(standard_errors > 0.0, 1.0, 0.0),
    )
'''
          if old not in text and "out=np.zeros_like(estimates)" not in text:
              raise SystemExit("singular-inference block not found")
          inference.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - run: python -m pip install black==26.5.1
      - run: python -m black src/pystarmax/likelihood_inference.py tests/test_likelihood_inference.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pystarmax/likelihood_inference.py tests/test_likelihood_inference.py
          git diff --cached --quiet || git commit -m "Format and harden likelihood inference"
          git push origin HEAD:agent/kalman-likelihood-inference

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,docs]"
      - run: python -m black --check --diff src tests tools examples
      - run: python -m isort --check-only src tests tools examples
      - run: python -m ruff check src tests tools examples
      - run: python -m mypy
      - run: python tools/generate_classic_diagnostics_reference.py
      - run: git diff --exit-code -- tests/reference/classic_diagnostics_v1.json
      - run: python -m mkdocs build --strict

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pip check
      - run: python -m pytest -q

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest --cov=pystarmax --cov-branch --cov-report=term-missing --cov-report=xml -q

  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
