name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-covariance-inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -q -e ".[test]"
      - name: Capture focused pytest output
        shell: bash
        run: |
          set +e
          python -m pytest tests/test_covariance_inference.py -q -x > covariance-diagnostic.txt 2>&1
          status=$?
          cat covariance-diagnostic.txt
          echo "pytest_status=$status" >> "$GITHUB_ENV"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: covariance-diagnostic
          path: covariance-diagnostic.txt
      - name: Fail after artifact upload
        shell: bash
        run: exit "$pytest_status"
