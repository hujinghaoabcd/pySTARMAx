name: Fix seasonal parameter typo

on:
  push:
    branches: [agent/original-scale-forecast-intervals]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/original-scale-forecast-intervals
      - name: Apply audited one-token fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pystarmax/models/seasonal_starima.py')
          text = path.read_text(encoding='utf-8')
          old = 'reshape(self.ar_order, nspatial)'
          new = 'reshape(self.ar_order, n_spatial)'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one target, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/fix-seasonal-typo.yml
          git diff --check
      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix seasonal parameter split typo"
          git push origin HEAD:agent/original-scale-forecast-intervals
